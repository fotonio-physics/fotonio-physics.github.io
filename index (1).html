<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Φωτόνιο Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
<style>
/* Παλέτα και μασκότ από το project Φωτόνιο: navy φόντο, τιρκουάζ περίγραμμα, κεχριμπαρί έμφαση. */
:root{
  --bg:#0F1B2D; --card:#16263D; --bor:#2E4566; --ban:#F5B841; --teal:#3FC1C9;
  --txt:#EEF2F8; --soft:#C9D3E0; --mut:#9FB0C4;
  --grn:#12382F; --grnt:#BFF2DE; --grnb:#2F8F72;
  --red:#3A1A24; --redt:#FFD6DA; --redb:#F0525F;
  --display:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
.wrap,.card,.banner,.bubble,.opt,.fb,.log li{overflow-wrap:anywhere}
.wrap>*{max-width:100%}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ban);outline-offset:2px}

.top{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:clamp(14px,4.4vw,18px);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-transform:uppercase;color:var(--ban);flex:1;min-width:0}
.brand span{color:var(--txt)}
.brand svg{flex:0 0 32px;width:32px;height:32px}
.chip svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.road{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.road i{width:calc((100% - 6px*7) / 8);max-width:30px;aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--bor);display:block}
.road i svg{width:100%;height:100%;display:block}
.road i.on{border:0}
.road i.goal{border:2px solid var(--ban);box-shadow:0 0 12px rgba(245,184,65,.45)}
.win{background:var(--grn);color:var(--grnt);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;font-weight:700}
.win svg{flex:0 0 44px;width:44px;height:44px}
.chip{background:var(--card);border:1px solid var(--bor);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{color:var(--ban)}

.mascot-row{display:flex;align-items:flex-end;gap:12px}
#mascot{flex:0 0 96px;width:96px;height:96px}
#mascot svg{width:100%;height:100%;display:block}
.bubble{position:relative;background:var(--card);border:1px solid var(--bor);border-radius:16px;padding:10px 14px;font-size:15px;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;bottom:18px;width:14px;height:14px;background:var(--card);border-left:1px solid var(--bor);border-bottom:1px solid var(--bor);transform:rotate(45deg)}

.card{background:var(--card);border:1px solid var(--bor);border-radius:16px;padding:20px}
.chsel h2{font-size:17px;margin:0 0 4px}.chsel p{margin:0 0 12px;font-size:14px;color:var(--soft)}
.chps{display:flex;flex-wrap:wrap;gap:8px}
.chg{border-top:1px solid var(--bor);padding:10px 0}.chg:first-of-type{border-top:0}
.chh{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--bor);color:var(--txt);border-radius:12px;padding:9px 12px;font-size:15px;font-weight:700;text-align:left}
.chh small{color:var(--teal);font-weight:700;font-size:13px}
.chh.on{background:rgba(63,193,201,.16);border-color:var(--teal)}.chh.on span::before{content:'✓ ';color:var(--teal)}
.chh.part{border-color:var(--teal);border-style:dashed}
.chg .chps{margin-top:8px;padding-left:6px}.chg:not(.open) .chps{display:none}
.chp{background:transparent;border:1.5px solid var(--bor);color:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;line-height:1.25;text-align:left}
.chp.on{background:rgba(63,193,201,.16);border-color:var(--teal);color:var(--txt)}
.chp.on::before{content:'✓ ';color:var(--teal)}
.chsel .link{display:block;margin:10px auto 0}
.banner{background:var(--card);border:1px solid var(--bor);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.banner .pill{align-self:flex-start;border:2px solid var(--ban);color:var(--ban);border-radius:999px;padding:4px 14px;font-size:12px;font-weight:600;letter-spacing:.1em}
.banner h1{font-size:clamp(24px,7.6vw,34px);line-height:1.1;font-weight:800;letter-spacing:.04em;display:flex;align-items:center;gap:12px}
.banner h1 svg{flex:0 0 44px;width:44px;height:44px}
.banner h1 span{color:var(--ban)}
.banner{container-type:inline-size}
.banner h1.stack{font-size:min(46px,calc((100cqi - 112px) / 6));line-height:1.05;gap:14px;max-width:100%}
.banner h1.stack svg{flex:0 0 auto;width:min(78px,20cqi);height:min(78px,20cqi)}
.banner h1 .words{min-width:0}
.banner h1 .words{display:flex;flex-direction:column;align-items:flex-start;color:var(--txt)}
.banner h1 .words > span:first-child{color:var(--txt)}
.banner h1 .words .w2{color:var(--ban)}
.banner p{margin:0;font-size:15px;color:var(--soft)}

.bar{height:8px;background:var(--card);border:1px solid var(--bor);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ban);transition:width .35s}
.bar.teal i{background:var(--teal)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;background:var(--teal);color:var(--bg);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:700;letter-spacing:.04em}
.tag.amb{background:var(--ban)}
.tag.ghost{background:transparent;color:var(--soft);border:1px solid var(--bor)}
.tag.hard{background:#F0525F;color:#fff}
.objbtn{display:block;margin:12px 0 0 auto;font-size:14px}
.objf{margin-top:12px;border:1px solid var(--bor);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.objf label{display:flex;gap:8px;align-items:flex-start;line-height:1.4;color:var(--txt)}.objf input{margin-top:3px;accent-color:var(--teal)}
.objf textarea{width:100%;box-sizing:border-box;background:var(--bg);color:var(--txt);border:1px solid var(--bor);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px;resize:vertical}
.objrow{display:flex;gap:14px;align-items:center}.objrow .btn.sm{flex:1;width:auto;padding:11px 12px;font-size:15px;white-space:nowrap}.objrow .link{white-space:nowrap}
.objok{margin:12px 0 0;font-size:14px;color:var(--teal);line-height:1.5}

.q{font-size:18px;font-weight:600;margin:12px 0 16px;text-wrap:pretty}
/* ίδια απόσταση γραμμών παντού: τα κλάσματα χωράνε μέσα στη γραμμή χωρίς να τη μεγαλώνουν */
.q,.opt,.fb{line-height:1.9}
.fig{background:#fff;border-radius:12px;padding:10px;margin:0 0 16px;text-align:center}
.fig img{max-width:100%;height:auto;display:inline-block}
sub,sup{line-height:0;font-size:.72em}
.vec{position:relative;display:inline-block}
.vec::before{content:"\2192";position:absolute;left:50%;top:-.55em;transform:translateX(-50%);font-size:.72em;line-height:1;font-weight:400}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.82em;line-height:1.05;margin:-.7em 2px -.6em}
.fr>span{padding:0 2px}.fr>span:first-child{border-bottom:1.5px solid currentColor}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1.5px solid var(--bor);border-radius:12px;padding:12px 14px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt .l{flex:0 0 26px;height:26px;border-radius:50%;background:var(--teal);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px}
.opt.ok{background:var(--grn);border-color:var(--grnb);color:var(--grnt)}
.opt.no{background:var(--red);border-color:var(--redb);color:var(--redt)}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;align-items:center;font-weight:700;font-size:17px;padding:16px}

.fb{margin-top:16px;border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--grn);color:var(--grnt)}
.fb.no{background:var(--red);color:var(--redt)}
.fb strong{display:block;margin-bottom:2px}
.btn{background:var(--ban);color:var(--bg);border:0;border-radius:12px;padding:14px 20px;font-weight:800;font-size:16px;width:100%}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;color:var(--ban);border:1.5px solid var(--bor);margin-top:10px}
.link{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;padding:6px;align-self:center}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--mut)}
.field input[type=text],.field input[type=password]{background:var(--bg);color:var(--txt);border:1.5px solid var(--bor);border-radius:12px;padding:12px 14px;font:inherit;width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--soft);margin-top:6px}
.check input{width:18px;height:18px;accent-color:var(--teal)}
.err{color:var(--redt);background:var(--red);border-radius:10px;padding:8px 12px;font-size:14px}

.big{font-family:var(--display);font-size:56px;font-weight:800;color:var(--ban);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:24px;color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--bg);border:1px solid var(--bor);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mut)}
.log{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.log li{display:flex;gap:10px;align-items:center;font-size:14px;background:var(--bg);border:1px solid var(--bor);border-radius:10px;padding:8px 12px}
.log .d{flex:0 0 12px;height:12px;border-radius:50%}
.log .g{background:var(--grnb)} .log .r{background:var(--redb)}
.log em{margin-left:auto;font-style:normal;color:var(--mut);font-size:12px;white-space:nowrap}
.note{font-size:12px;color:var(--mut);text-align:center;margin:0}
.lvl{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin:6px 0 4px}
.lvl b{color:var(--ban)}

/* ---- κάρτα προόδου ---- */
.pc{background:var(--card);border:1px solid var(--bor);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;overflow:hidden}
.pc.max{border-color:var(--ban);box-shadow:0 0 22px rgba(245,184,65,.35)}
.pchead{align-self:stretch;display:flex;justify-content:space-between;align-items:center;gap:8px}
.nick{border:2px solid var(--ban);color:var(--ban);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tierchip{background:var(--ban);color:var(--bg);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:800}
.saytop{background:var(--bg);border:1px solid var(--bor);border-radius:14px;padding:8px 12px;font-size:14px;color:var(--soft);margin-top:4px;align-self:stretch}
.hero{width:min(240px,82%)}
.hero svg{width:100%;height:auto;display:block;overflow:visible}
.hero.big{width:min(260px,78%)}
.pc .num{font-size:48px;font-weight:800;line-height:1;color:var(--ban);font-variant-numeric:tabular-nums}
.pc .num small{display:block;font-size:14px;font-weight:600;color:var(--soft);margin-top:2px}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;align-self:stretch;margin-top:6px}
.seg i{display:block;height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--bor)}
.seg i.on{background:var(--ban);border-color:var(--ban);box-shadow:0 0 8px rgba(245,184,65,.5)}
.next{font-size:13px;color:var(--mut)}.next b{color:var(--ban)}
.win{background:var(--grn);color:var(--grnt);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;font-weight:700;margin:4px 0 10px}
.win .plus{flex:0 0 auto;font-size:26px;font-weight:800;color:var(--ban)}
.chip svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.ov{position:fixed;inset:0;background:rgba(6,12,22,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;overflow:auto}
.ovcard{background:var(--card);border:1.5px solid var(--ban);border-radius:22px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 0 40px rgba(245,184,65,.3)}
.ovcard .pill{border:2px solid var(--ban);color:var(--ban);border-radius:999px;padding:4px 14px;font-size:12px;font-weight:700;letter-spacing:.1em}
.ovcard h2{font-size:24px}
.ovcard .lead{margin:0;color:var(--soft)}
.tiername{font-size:34px;font-weight:800;color:var(--ban)}
.ovcard .btn{margin-top:4px}
.sharebtn{display:block;text-align:center;text-decoration:none}
.ovcard #dl{margin-top:-2px}
.shot{width:min(260px,80%);border-radius:12px;border:1px solid var(--bor)}
textarea#cpt{width:100%;height:90px;background:var(--bg);color:var(--soft);border:1px solid var(--bor);border-radius:10px;padding:8px;font:inherit;font-size:13px}
@media (prefers-reduced-motion:no-preference){
  .seg i.new{animation:popin .9s ease-out}
  @keyframes popin{0%{transform:scale(.2);background:#fff}60%{transform:scale(1.35)}100%{transform:scale(1)}}
  #mascot svg{animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-4px)}}
  .pop{animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.97);opacity:.4}}
}
@media (prefers-reduced-motion:no-preference){
  .float{animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-4px)}}
  .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite alternate}
  .fl.b{animation-duration:.8s;animation-delay:-.3s}.fl.c{animation-duration:.65s;animation-delay:-.5s}
  @keyframes flick{0%{transform:scale(1,1) skewX(0)}50%{transform:scale(.94,1.08) skewX(-3deg)}100%{transform:scale(1.04,.95) skewX(3deg)}}
  .spark{animation:rise 1.8s linear infinite}
  @keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-55px);opacity:0}}
  .halo{animation:pulse 2.4s ease-in-out infinite}
  .spin{transform-origin:150px 115px;animation:spin 18s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .orbit{transform-origin:150px 115px;animation:spin 4s linear infinite}
  .twinkle{transform-box:fill-box;transform-origin:center;animation:tw 1.6s ease-in-out infinite}
  @keyframes tw{50%{transform:scale(.6);opacity:.5}}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:sway 1.3s ease-in-out infinite alternate}
  @keyframes sway{0%{transform:scale(1,.96) skewX(-3deg)}50%{transform:scale(.97,1.05) skewX(1deg)}100%{transform:scale(1.02,.99) skewX(3deg)}}
  @keyframes pulse{50%{opacity:.75}}
}

/* Top 3 */
.podc{padding:18px 16px 16px}
.podh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.podh h2{font-size:17px}
.podh span{font-size:12.5px;color:var(--mut)}
.pod{display:grid;grid-template-columns:1fr 1.12fr 1fr;align-items:end;gap:8px}
.ps{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.ps .ph{width:52px;height:52px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.ps .ph svg{max-width:52px;max-height:52px}
.ps.r1 .ph{width:66px;height:66px}.ps.r1 .ph svg{max-width:66px;max-height:66px}
.ps .nm{font-weight:800;font-size:14px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps .ct{font-size:13px;font-weight:800;color:var(--ban);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.ps .st{width:100%;border-radius:12px 12px 4px 4px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-weight:800;font-size:24px;border:1px solid}
.ps.r1 .st{height:96px;background:linear-gradient(180deg,rgba(245,184,65,.32),rgba(245,184,65,.08));border-color:rgba(245,184,65,.7);color:var(--ban);box-shadow:0 0 22px rgba(245,184,65,.22)}
.ps.r2 .st{height:70px;background:linear-gradient(180deg,rgba(201,211,224,.22),rgba(201,211,224,.05));border-color:rgba(201,211,224,.5);color:#DDE4EE}
.ps.r3 .st{height:52px;background:linear-gradient(180deg,rgba(214,142,82,.25),rgba(214,142,82,.06));border-color:rgba(214,142,82,.55);color:#E7A974}
.ps.me .nm{color:var(--teal)}
.ps.emp .nm,.ps.emp .ct{color:var(--mut);font-weight:600}
.ps.emp .ph{opacity:.35}
.podme{margin-top:12px;text-align:center;font-size:13.5px;color:var(--soft)}
.podme b{color:var(--ban)}
</style>

<script>
/* ===== Κοινή λογική (server + demo): επιλογή ερωτήσεων γύρου, προφίλ, επίπεδα ===== */
var ROUND = { mc: 4, tf: 5 };          // όπως το Θέμα Α: 4 πολλαπλής + 5 Σωστό/Λάθος
var POINTS = { mc: 5, tf: 1 };         // σύνολο 25
/* Φωτόνια ανά γύρο: πάνω από το μισό (13–19) = 1, 20–24 = 2, τέλειος γύρος 25/25 = 3.
   Κάθε 10 φωτόνια = νέα βαθμίδα, στα 100 το «φως». */
function photonsFor(score) { return score >= 25 ? 3 : score >= 20 ? 2 : score >= 13 ? 1 : 0; }
/* Κεφάλαια και ενότητες της ύλης (με τη σειρά που εμφανίζονται στην επιλογή του μαθητή).
   Η επιλογή αποθηκεύεται ως «Κεφάλαιο|Ενότητα». */
var SECTIONS = [{"ch": "Κρούσεις", "secs": ["Κρούσεις"]}, {"ch": "Ταλαντώσεις", "secs": ["Απλή αρμονική ταλάντωση", "Φθίνουσα ταλάντωση", "Εξαναγκασμένη ταλάντωση"]}, {"ch": "Κύματα", "secs": ["Τρέχον κύμα", "Συμβολή κυμάτων", "Στάσιμα κύματα"]}, {"ch": "Ηλεκτρομαγνητικά κύματα", "secs": ["Ηλεκτρομαγνητικά κύματα – φάσμα"]}, {"ch": "Στερεό", "secs": ["Κινήσεις", "Ροπή – ισορροπία", "Στροφορμή"]}, {"ch": "Μαγνητικό πεδίο", "secs": ["Πεδίο ρευματοφόρων αγωγών", "Lorentz – κίνηση φορτίων", "Laplace – δυνάμεις μεταξύ αγωγών"]}, {"ch": "Επαγωγή", "secs": ["Νόμος Faraday – κανόνας Lenz", "Εναλλασσόμενη τάση και ρεύμα", "Αυτεπαγωγή"]}, {"ch": "Κβαντομηχανική", "secs": ["Μέλαν σώμα – κβάντωση", "Φωτοηλεκτρικό – φωτόνια", "Ακτίνες Χ – Compton", "de Broglie – αβεβαιότητα"]}];
var CHAPTERS = SECTIONS.map(function (s) { return s.ch; });
function cleanChapters(sel) {          // → έγκυρα κλειδιά «Κεφάλαιο|Ενότητα» (ένα σκέτο κεφάλαιο = όλες οι ενότητές του)
  if (!sel || !sel.length) return [];
  var a = [].concat(sel).map(String), out = [];
  SECTIONS.forEach(function (s) {
    s.secs.forEach(function (x) { var k = s.ch + '|' + x; if (a.indexOf(k) >= 0 || a.indexOf(s.ch) >= 0) out.push(k); });
  });
  return out;
}
function selLabel(sel) {               // σύντομη περιγραφή για το φύλλο «Γύροι»
  var k = cleanChapters(sel), parts = [];
  SECTIONS.forEach(function (s) {
    var mine = s.secs.filter(function (x) { return k.indexOf(s.ch + '|' + x) >= 0; });
    if (mine.length === s.secs.length) parts.push(s.ch);
    else if (mine.length) parts.push(s.ch + ' (' + mine.join(', ') + ')');
  });
  return parts.join('; ');
}

var TIERS = ['Σκοτάδι', 'Σπίθα', 'Λάμψη', 'Ακτίνα', 'Δέσμη', 'Αυγή', 'Λέιζερ', 'Αστέρι', 'Ήλιος', 'Σουπερνόβα', 'Φως'];
var UNLOCK = ['', 'ανοίγει τα μάτια και κερδίζει την πρώτη του σπίθα', 'λαμπερό περίγραμμα και χαιρετά', 'ακτίνες φωτός',
  'οι ακτίνες αρχίζουν να γυρίζουν', 'σπίθες, φωτοστέφανο και χέρια ψηλά', 'ένα φωτόνιο σε τροχιά γύρω του',
  'η πρώτη φλόγα', 'χρυσές ακτίνες και μεγαλύτερη φλόγα', 'διπλή αύρα', 'πλήρης φλόγα: το «φως»'];
function levelOf(photons) {
  var t = Math.min(10, Math.floor(photons / 10));
  return { t: t, name: TIERS[t], into: photons % 10, nextName: t < 10 ? TIERS[t + 1] : null,
           next: t < 10 ? (t + 1) * 10 : null, unlock: UNLOCK[t], unlockNext: t < 10 ? UNLOCK[t + 1] : null };
}

/* history: [{qid, ok(1/0), t(ms)}] με χρονολογική σειρά. Επιστρέφει κατάσταση ανά ερώτηση. */
function questionState(history) {
  var st = {};
  history.forEach(function (h) {
    var s = st[h.qid] || (st[h.qid] = { n: 0, right: 0, last: null, t: 0 });
    s.n++; if (h.ok) s.right++;
    s.last = h.ok ? 1 : 0; s.t = h.t;
  });
  return st;
}

function shuffleArr(a, rnd) {
  a = a.slice(); rnd = rnd || Math.random;
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; }
  return a;
}

/* Επιλογή γύρου:
   1) καινούριες ερωτήσεις (δεν τις έχει δει)
   2) «ρεβάνς»: όσες απάντησε λάθος την τελευταία φορά (1 ΠΕ + 2 Σ/Λ ανά γύρο όσο υπάρχουν καινούριες,
      περισσότερες όταν τελειώσουν οι καινούριες)
   3) «επανάληψη»: σωστές, μόνο αν δεν φτάνουν οι παραπάνω (πρώτα όσες είδε παλαιότερα) */
/* Δυσκολία ερώτησης για την τάξη: από τις τελευταίες CLASS_WIN απαντήσεις όλων των μαθητών.
   Επειδή μετράνε μόνο οι πρόσφατες, όταν η τάξη αρχίσει να την απαντά σωστά, παύει να θεωρείται δύσκολη. */
var CLASS_WIN = 20, HARD_MIN_N = 4, HARD_ERR = 0.4;
function classStatsOf(answers) {             // answers: [{qid, ok}] με χρονολογική σειρά
  var by = {};
  answers.forEach(function (a) { (by[a.qid] = by[a.qid] || []).push(a.ok ? 1 : 0); });
  var out = {};
  Object.keys(by).forEach(function (id) {
    var w = by[id].slice(-CLASS_WIN), wrong = w.filter(function (x) { return !x; }).length;
    out[id] = { n: w.length, err: wrong / w.length };
  });
  return out;
}
function isHard(cls, id) { var c = cls && cls[id]; return !!(c && c.n >= HARD_MIN_N && c.err >= HARD_ERR); }

function pickRound(qs, history, rnd, chapters, cls) {
  rnd = rnd || Math.random;
  var keys = cleanChapters(chapters), all = qs;
  if (keys.length) qs = all.filter(function (q) { return keys.indexOf(q.ch + '|' + q.sub) >= 0; });
  // αν οι ενότητες δεν φτάνουν για έναν πλήρη γύρο, συμπληρώνει από τα ίδια κεφάλαια
  var chs = keys.map(function (k) { return k.split('|')[0]; });
  ['mc', 'tf'].forEach(function (type) {
    var have = qs.filter(function (q) { return q.type === type; }).length;
    if (have >= ROUND[type]) return;
    var extra = all.filter(function (q) { return q.type === type && qs.indexOf(q) < 0 && chs.indexOf(q.ch) >= 0; });
    if (have + extra.length < ROUND[type]) extra = all.filter(function (q) { return q.type === type && qs.indexOf(q) < 0; });
    qs = qs.concat(shuffleArr(extra, rnd).slice(0, ROUND[type] - have));
  });
  var st = questionState(history);
  var out = [];
  ['mc', 'tf'].forEach(function (type) {
    var need = ROUND[type];
    var pool = qs.filter(function (q) { return q.type === type; });
    var fresh = shuffleArr(pool.filter(function (q) { return !st[q.id]; }), rnd);
    var retry = shuffleArr(pool.filter(function (q) { return st[q.id] && st[q.id].last === 0; }), rnd)
      .sort(function (a, b) { return st[a.id].t - st[b.id].t; });
    var review = shuffleArr(pool.filter(function (q) { return st[q.id] && st[q.id].last === 1; }), rnd)
      .sort(function (a, b) { return st[a.id].t - st[b.id].t; });
    var retrySlots = type === 'mc' ? 1 : 2;
    var pick = [];
    function take(list, n, kind) {
      while (n > 0 && list.length && pick.length < need) {
        var q = list.shift();
        if (pick.some(function (p) { return p.q.id === q.id; })) continue;
        pick.push({ q: q, kind: kind }); n--;
      }
    }
    // «δύσκολες της τάξης»: 1 ΠΕ + 1 Σ/Λ ανά γύρο, όσες ο μαθητής δεν έχει δει ή δεν τις είχε σωστές
    // την τελευταία φορά ή τις είχε σωστές πριν από πάνω από 7 μέρες. Οι πιο δύσκολες έχουν προτεραιότητα.
    var now = Date.now(), WEEK = 7 * 864e5;
    var hard = shuffleArr(pool.filter(function (q) {
      if (!isHard(cls, q.id)) return false;
      var s = st[q.id];
      return !s || s.last === 0 || now - s.t > WEEK;
    }), rnd).sort(function (a, b) { return cls[b.id].err - cls[a.id].err; });
    take(retry, Math.min(retrySlots, need), 'retry');
    take(hard, 1, 'hard');
    take(fresh, need, 'new');
    take(retry, need, 'retry');
    take(review, need, 'review');
    shuffleArr(pick, rnd).forEach(function (p) { out.push(p); });
  });
  return out;
}

function profileOf(qs, history, rounds) {
  var st = questionState(history);
  var ids = {}; qs.forEach(function (q) { ids[q.id] = 1; });
  var seen = 0, mastered = 0, retry = 0;
  Object.keys(st).forEach(function (id) {
    if (!ids[id]) return;
    seen++; if (st[id].last === 1) mastered++; else retry++;
  });
  var total = 0, perfect = 0, best = 0, photons = 0;
  rounds.forEach(function (r) { total += r.score; photons += photonsFor(r.score); if (r.score === 25) perfect++; if (r.score > best) best = r.score; });
  return { questions: qs.length, seen: seen, mastered: mastered, retry: retry,
           fresh: qs.length - seen, rounds: rounds.length, total: total, perfect: perfect, best: best,
           photons: photons, level: levelOf(photons) };
}

function scoreRound(qsById, answers) {
  // answers: [{qid, ok}] — μετράει μόνο η πρώτη απάντηση σε κάθε ερώτηση
  var done = {}, score = 0, mc = 0, tf = 0;
  answers.forEach(function (a) {
    if (done[a.qid] || !qsById[a.qid]) return; done[a.qid] = 1;
    var t = qsById[a.qid].type;
    if (a.ok) { score += POINTS[t]; if (t === 'mc') mc++; else tf++; }
  });
  return { score: Math.min(score, 25), mc: mc, tf: tf, answered: Object.keys(done).length };
}

/* Σύνδεση με το Apps Script (το Sheet του καθηγητή) μέσω απλού αιτήματος, χωρίς πλαίσιο της Google */
const API_URL='https://script.google.com/macros/s/AKfycbwoioQnP3Akcq6fvg0NuGGhjRryhF-g139khGRPJM-QkYMISVRggAGnQIqcJBrbmU-M6A/exec';
function apiCall(fn,args,tries){
  tries=tries==null?2:tries;
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow',credentials:'omit',cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json()})
    .then(j=>{if(!j.ok){const e=new Error(j.err||'error');e.server=true;throw e}return j.r})
    .catch(e=>{if(!e.server&&tries>1)return new Promise(r=>setTimeout(r,900)).then(()=>apiCall(fn,args,tries-1));throw e});
}

const API={login:(n,p,c)=>apiCall('login',[n,p,!!c]), newRound:(n,p,c)=>apiCall('newRound',[n,p,c||[]]),
  answer:(n,p,r,q,c,k)=>apiCall('answer',[n,p,r,q,c,k||'']), report:(n,p,r,q,why,t)=>apiCall('report',[n,p,r,q,why,t||'']),
  finish:(n,p,r,c)=>apiCall('finish',[n,p,r,c||[]]), top3:()=>apiCall('top3',[]).then(j=>JSON.parse(j))};

/* ---------- Το Φωτόνιο του παίκτη ανάλογα με τα φωτόνια (βαθμίδα ανά 10) ---------- */
function tierHero(n){
  const uid='u'+Math.random().toString(36).slice(2,7);
  /* Κάθε δεκάδα ξεκλειδώνει κάτι καινούριο που φαίνεται καθαρά:
     0 μισόκλειστα μάτια στο σκοτάδι · 10 ανοίγει τα μάτια, πρώτη σπίθα · 20 λαμπερό περίγραμμα, μάγουλα, χαιρετά
     30 ακτίνες φωτός · 40 οι ακτίνες γυρίζουν, φωτεινή ουρά · 50 σπίθες, φωτοστέφανο, σηκώνει τα χέρια
     60 φωτόνιο σε τροχιά · 70 πρώτη φλόγα · 80 χρυσές ακτίνες, μεγαλύτερη φλόγα · 90 διπλή αύρα · 100 πλήρης φλόγα «φως» */
  const t=Math.min(10,Math.floor(n/10));
  const T='#3FC1C9',A='#F5B841',N='#0F1B2D';
  const body=['#0B1320','#132541','#18304F','#1C3A5E','#21446D','#264E7C','#2A588A','#2E6297','#326CA4','#3776B0','#3C80BC'][t];
  const bright=[.5,.72,.84,.92,1,1,1,1,1,1,1][t];
  const glow=[0,3,7,10,13,16,18,20,22,24,26][t];
  let back='', crown='', front='';
  // ακτίνες φωτός πίσω από το σώμα
  if(t>=3){
    const L=t>=8?32:t>=5?28:t>=4?24:16, c=t>=8?'#FFD36B':A, cnt=t>=8?16:12;
    let r='';for(let i=0;i<cnt;i++){const a=i*360/cnt*Math.PI/180;r+=`<line x1="${(150+76*Math.sin(a)).toFixed(1)}" y1="${(115-76*Math.cos(a)).toFixed(1)}" x2="${(150+(76+L)*Math.sin(a)).toFixed(1)}" y2="${(115-(76+L)*Math.cos(a)).toFixed(1)}" stroke="${c}" stroke-width="${t>=8?5:4}" stroke-linecap="round" opacity="${t>=8?.85:.6}"/>`;}
    back+=`<g class="${t>=4?'spin':''}">${r}</g>`;
  }
  // φωτοστέφανο / αύρα
  if(t>=5) back+=`<circle class="halo" cx="150" cy="115" r="${t>=9?84:78}" fill="none" stroke="${A}" stroke-width="3" opacity=".7" stroke-dasharray="${t>=9?'':'6 8'}"/>`;

  // πρώτη σπίθα (10–49)
  if(t>=1&&t<5) front+=`<path class="twinkle" d="M206 52 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#FFF3D1"/>`;
  // σπίθες που ανεβαίνουν (50+)
  if(t>=5){
    const ns=t>=7?5:t>=6?4:3;
    const sp=[[-26,40,'#FFF3D1',3.4,-.2],[22,44,A,3.2,-1.0],[-6,34,T,3,-.6],[34,52,'#FFF3D1',2.8,-1.4],[-38,54,A,3,-.9]];
    for(let i=0;i<ns;i++){const [dx,y,c,r,d]=sp[i];front+=`<circle class="spark" cx="${150+dx}" cy="${y}" r="${r}" fill="${c}" style="animation-delay:${d}s"/>`;}
  }
  // φωτόνια σε τροχιά (60+)
  if(t>=6){const no=t>=10?3:t>=7?2:1;for(let i=0;i<no;i++)front+=`<g class="orbit" style="animation-delay:${-i*1.3}s"><circle cx="150" cy="${115-90}" r="6" fill="${i%2?T:A}"/><circle cx="150" cy="${115-90}" r="11" fill="${i%2?T:A}" opacity=".25"/></g>`;}
  // φλόγα (70+)
  if(n>=70){
    /* μία ενιαία φλόγα σαν το 🔥: κεντρική ψηλή γλώσσα με δύο μικρότερες στα πλάγια, στρώσεις χρώματος από μέσα προς τα έξω */
    const k2=n>=100?Math.min(1.15,1+(n-100)/400):n>=90?.88:n>=80?.76:.62;
    const H=96*k2+22, W=90*Math.min(1.05,.68+k2*.32);

/* ---------- Μαθηματική γραφή: {α/β} -> κλάσμα ---------- */
function m(s){return s.replace(/\{((?:[^{}\/]|[_^]\{[^{}]*\})+)\/((?:[^{}]|[_^]\{[^{}]*\})+)\}/g,'<span class="fr"><span>$1</span><span>$2</span></span>').replace(/_\{([^}]+)\}/g,'<sub>$1</sub>').replace(/\^\{([^}]+)\}/g,'<sup>$1</sup>').replace(/([^\s\u20D7])\u20D7([\u2080-\u2089]*)/g,'<span style="white-space:nowrap"><span class="vec">$1</span>$2</span>');}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ασφάλεια: αν ο τίτλος δεν χωράει (π.χ. άλλη γραμματοσειρά), μικραίνει ώσπου να χωρέσει */
function fitTitle(){
  const h=document.querySelector('h1.stack'); if(!h)return;
  h.style.fontSize='';
  const box=h.parentElement, w=h.querySelector('.words');
  let fs=parseFloat(getComputedStyle(h).fontSize), lim=box.getBoundingClientRect().right-parseFloat(getComputedStyle(box).paddingRight);
  while(fs>14&&w.getBoundingClientRect().right>lim+0.5){fs-=1;h.style.fontSize=fs+'px';}
}
window.addEventListener('resize',fitTitle);
try{document.fonts&&document.fonts.ready.then(fitTitle)}catch(e){}
const ERR={nick:'Το ψευδώνυμο θέλει 2–16 γράμματα ή αριθμούς.',pin:'Το PIN είναι 4 ψηφία.',wrongpin:'Λάθος PIN για αυτό το ψευδώνυμο. Αν είναι καινούριος παίκτης, διάλεξε άλλο ψευδώνυμο.'};
async function doLogin(create){
  const nick=document.getElementById('nick').value.trim(), pin=document.getElementById('pin').value.trim();
  const rem=document.getElementById('rem').checked, e=document.getElementById('e'), go=document.getElementById('go');
  e.innerHTML=''; go.disabled=true; go.textContent='Μια στιγμή…';
  try{
    const r=await API.login(nick,pin,create);
    if(r.err){e.innerHTML=`<div class="err">${ERR[r.err]}</div>`;}
    else if(r.needCreate){
      document.getElementById('say').textContent=`Πρώτη φορά εδώ, ${nick}; Θα φτιάξω νέο παίκτη. Θυμήσου το PIN σου!`;
      document.getElementById('mascot').innerHTML=mascot('cheer');
      go.textContent='Δημιουργία νέου παίκτη'; go.disabled=false;
      document.getElementById('f').onsubmit=ev=>{ev.preventDefault();doLogin(true)};
      return;
    }else{
      saveLogin(rem?{nick,pin}:{nick:''});
      U={nick:r.nick,pin,profile:r.profile,url:r.url||''}; lobby(create?'new':'back'); return;
    }
  }catch(err){console.error(err);e.innerHTML=`<div class="err">Δεν υπάρχει σύνδεση. Δοκίμασε ξανά σε λίγο.</div>`;}
  go.disabled=false; go.textContent=create?'Δημιουργία νέου παίκτη':'Μπες στο παιχνίδι';
}

function segBar(into,pop){
  let h='';for(let i=0;i<10;i++)h+=`<i class="${i<into?'on':''} ${pop&&i===into-1?'new':''}"></i>`;
  return `<div class="seg" aria-label="${into} από 10 φωτόνια για την επόμενη βαθμίδα">${h}</div>`;
}
function nextLine(L){
  return L.t<10?`<b>${L.into}/10</b> · στα ${L.next}: ${L.unlockNext}`:`Έφτασες στο «φως»! Κάθε νέο φωτόνιο δυναμώνει τη φωτιά.`;
}
function photonCard(p,say,pop){

/* ---------- Κεφάλαια που διάλεξε ο μαθητής (μνήμη συσκευής, ανά ψευδώνυμο) ---------- */
const chKey=()=>'fotonio_quiz_ch_'+String(U.nick).toLowerCase();
function getCh(){try{return cleanChapters(JSON.parse(localStorage.getItem(chKey()))||[])}catch(e){return []}}
function setCh(a){try{localStorage.setItem(chKey(),JSON.stringify(a))}catch(e){}}
function chCard(){
  const sel=getCh();
  return `<div class="card chsel"><h2>Από ποια κεφάλαια;</h2><p>Πάτα ένα κεφάλαιο και μετά κράτησε μόνο τις ενότητες που έχετε κάνει στο σχολείο. Μπορείς να τα αλλάζεις όποτε θέλεις.</p>
    ${SECTIONS.map(g=>{const n=g.secs.filter(x=>sel.includes(g.ch+'|'+x)).length;

      ${g.secs.length>1?`<div class="chps">${g.secs.map(x=>{const k=g.ch+'|'+x;return `<button class="chp ${sel.includes(k)?'on':''}" data-k="${esc(k)}" aria-pressed="${sel.includes(k)}">${esc(x)}</button>`}).join('')}</div>`:''}</div>`}).join('')}
    <button class="link" id="chall">${sel.length===ALLK.length?'Καμία επιλογή':'Όλη η ύλη'}</button></div>`;
}
const ALLK=SECTIONS.flatMap(g=>g.secs.map(x=>g.ch+'|'+x));
function wireCh(){
  const paint=()=>{const sel=getCh();
    document.querySelectorAll('.chp').forEach(b=>{const on=sel.includes(b.dataset.k);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
    document.querySelectorAll('.chh').forEach(b=>{const g=SECTIONS.find(x=>x.ch===b.dataset.ch),n=g.secs.filter(x=>sel.includes(g.ch+'|'+x)).length;
      b.classList.toggle('on',n===g.secs.length);b.classList.toggle('part',n>0&&n<g.secs.length);b.setAttribute('aria-pressed',n===g.secs.length);
      b.querySelector('small').textContent=n&&g.secs.length>1?n+'/'+g.secs.length:'';b.parentNode.classList.toggle('open',n>0)});
    const pb=document.getElementById('play');
    if(pb){pb.disabled=!sel.length;pb.textContent=sel.length?(U.profile.rounds?'Νέος γύρος':'Πάμε για τον πρώτο γύρο'):'Διάλεξε τουλάχιστον μία ενότητα';}
    const a=document.getElementById('chall'); if(a)a.textContent=sel.length===ALLK.length?'Καμία επιλογή':'Όλη η ύλη';};
  document.querySelectorAll('.chp').forEach(b=>b.onclick=()=>{let a=getCh();const k=b.dataset.k;
    a=a.includes(k)?a.filter(x=>x!==k):a.concat(k);setCh(cleanChapters(a));paint();});
  document.querySelectorAll('.chh').forEach(b=>b.onclick=()=>{const g=SECTIONS.find(x=>x.ch===b.dataset.ch),ks=g.secs.map(x=>g.ch+'|'+x);
    let a=getCh();const full=ks.every(k=>a.includes(k));a=full?a.filter(k=>!ks.includes(k)):a.concat(ks.filter(k=>!a.includes(k)));setCh(cleanChapters(a));paint();});
  document.getElementById('chall').onclick=()=>{setCh(getCh().length===ALLK.length?[]:ALLK.slice());paint();};
  paint();
}

  const T=TOP||[],me=U&&U.nick,my=U?U.profile.photons:0;
  const slot=(i)=>{const x=T[i];const r='r'+(i+1);
    if(!x)return `<div class="ps ${r} emp"><div class="ph">${tierHero(0)}</div><div class="nm">κενή θέση</div><div class="ct">—</div><div class="st">${i+1}</div></div>`;
    const isMe=me&&x.nick.toLowerCase()===me.toLowerCase();
    return `<div class="ps ${r} ${isMe?'me':''}"><div class="ph">${tierHero(x.ph)}</div><div class="nm">${esc(x.nick)}</div><div class="ct">${x.ph} ${x.ph===1?'φωτόνιο':'φωτόνια'}</div><div class="st">${i+1}</div></div>`};
  let line='';
  if(TOP){const inTop=T.some(x=>me&&x.nick.toLowerCase()===me.toLowerCase());
    if(inTop)line=T[0]&&T[0].nick.toLowerCase()===me.toLowerCase()?'Είσαι στην κορυφή! Κράτα τη θέση σου.':'Είσαι στο βάθρο! Η κορυφή είναι κοντά.';
    else if(T.length<3)line='Υπάρχει ελεύθερη θέση στο βάθρο: κέρδισε <b>1 φωτόνιο</b> και ανεβαίνεις.';
    else{const need=T[2].ph-my+1;line=`Σου λείπουν <b>${need} ${need===1?'φωτόνιο':'φωτόνια'}</b> για το βάθρο.`}}
  return `<div class="card podc" id="podium"><div class="podh"><h2>Το βάθρο του Φωτονίου</h2><span>Top 3 σε φωτόνια</span></div>
    <div class="pod">${slot(1)}${slot(0)}${slot(2)}</div>${line?`<div class="podme">${line}</div>`:''}</div>`;
}
function loadTop(){API.top3().then(t=>{TOP=t||[];const el=document.getElementById('podium');if(el)el.outerHTML=podium()}).catch(()=>{});}

/* ---------- Γύρος ---------- */
async function startRound(){
  const b=document.getElementById('play'); b.disabled=true; b.textContent='Ετοιμάζω τον γύρο…';
  try{
    const ch=getCh(); if(!ch.length){lobby('back');return;}
    const r=await API.newRound(U.nick,U.pin,ch);
    if(!r.questions||!r.questions.length)throw new Error('empty');
    S={round:r.round,qs:r.questions,i:0,score:0,streak:0,maxStreak:0,log:[]};
    ask();
  }catch(e){b.disabled=false;b.textContent='Δοκίμασε ξανά';}
}

function ask(){
  const q=S.qs[S.i]; S.answered=false;
  let opts;
  if(q.type==='mc'){
    {const L=q.o.map((t,k)=>({t,k,ok:k===q.a}));S.opts=q.o.every(t=>/\([αβγδ]\)/.test(t))?L:shuffle(L);}
    const L=['α','β','γ','δ'];
    opts=`<div class="opts">`+S.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${L[k]}</span><span>${m(esc(o.t))}</span></button>`).join('')+`</div>`;
  }else{
    opts=`<div class="tf"><button class="opt" data-k="1">Σωστό</button><button class="opt" data-k="0">Λάθος</button></div>`;
  }
  const pct=Math.round(S.i/S.qs.length*100);
  const kind=q.kind==='retry'?'<span class="tag amb">Ρεβάνς!</span>':q.kind==='hard'?'<span class="tag hard">Δυσκολεύει την τάξη</span>':q.kind==='review'?'<span class="tag ghost">Επανάληψη</span>':'';
  const pts=q.type==='mc'?'5 πόντοι':'1 πόντος';
  const say=q.kind==='retry'?'Αυτή σε είχε νικήσει. Πάρε την εκδίκησή σου!':q.kind==='hard'?'Αυτή τη χάνουν πολλοί στην τάξη. Δείξε τους πώς γίνεται!':(q.type==='mc'?'Διάλεξε την επιλογή που συμπληρώνει σωστά την πρόταση.':'Σωστό ή Λάθος;');
  app.innerHTML=`
  <div class="top"><div class="brand">${LOGO}<span>Φωτόνιο</span> Quiz</div>
    <div class="chip"><b id="sc">${S.score}</b>/25</div><div class="chip">🔥 <b id="st">${S.streak}</b></div></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${S.qs.length}" aria-valuenow="${S.i}"><i style="width:${pct}%"></i></div>
  <div class="mascot-row"><div id="mascot">${mascot('idle')}</div><div class="bubble" id="say">${say}</div></div>
  <div class="card pop">
    <div class="meta"><span class="tags"><span class="tag">${esc(q.ch)}</span>${kind}</span><span>${pts}</span></div>
    <p class="q">${m(esc(q.q))}</p>
    ${q.img&&/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(q.img)?`<div class="fig"><img src="${q.img}" alt="Σχήμα της ερώτησης"></div>`:''}
    ${opts}
    <div id="after"></div>
  </div>
  <p class="note">Ερώτηση ${S.i+1} από ${S.qs.length}${q.src&&q.src.indexOf('Πανελλαδικ')>=0||q.src&&q.src.indexOf('Επαναληπτικ')>=0?' · '+esc(q.src):''}</p>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  window.scrollTo({top:0});
}

const OKS=["Μπράβο!","Σωστά!","Έτσι μπράβο!","Ακριβώς!"];
const BADS=["Όχι αυτή τη φορά.","Κοντά, δες την εξήγηση.","Θα την ξαναβρείς για ρεβάνς."];
function pick(k){
  if(S.answered)return; S.answered=true;
  const q=S.qs[S.i];
  let ok, chosen;
  const btns=[...app.querySelectorAll('.opt')];
  if(q.type==='mc'){
    ok=S.opts[k].ok; chosen=S.opts[k].k;
    btns.forEach((b,i)=>{b.disabled=true; if(S.opts[i].ok)b.classList.add('ok'); else if(i===k)b.classList.add('no');});
  }else{
    chosen=k===1; ok=chosen===q.a;
    btns.forEach(b=>{b.disabled=true; const v=b.dataset.k==='1'; if(v===q.a)b.classList.add('ok'); else if(+b.dataset.k===k)b.classList.add('no');});
  }
  const gain=ok?(q.type==='mc'?5:1):0;
  if(ok){S.streak++;S.maxStreak=Math.max(S.maxStreak,S.streak);S.score+=gain}else S.streak=0;
  S.log.push({id:q.id,ok,ch:q.ch,type:q.type,kind:q.kind});
  // αποθήκευση με τη σειρά (στο παρασκήνιο)
  const args=[U.nick,U.pin,S.round,q.id,chosen,q.kind||''];
  saving=saving.then(()=>API.answer(...args)).catch(()=>API.answer(...args)).catch(()=>{S.lost=true});
  document.getElementById('sc').textContent=S.score; document.getElementById('st').textContent=S.streak;
  document.getElementById('mascot').innerHTML=mascot(ok?'cheer':'sad');
  document.getElementById('say').textContent=ok?(OKS[S.i%OKS.length]+` +${gain}`+(S.streak>2?` · Σερί ${S.streak}!`:'')):BADS[S.i%BADS.length];
  const last=S.i===S.qs.length-1;
  document.getElementById('after').innerHTML=`
    <div class="fb ${ok?'ok':'no'}"><strong>${ok?'Σωστό':'Λάθος'}</strong>${m(esc(q.ex))}</div>
    <div id="obj"><button class="link objbtn" id="objopen">✋ Διαφωνώ με την απάντηση</button></div>
    <div style="height:10px"></div><button class="btn" id="nx">${last?'Δες το σκορ σου':'Επόμενη'}</button>`;
  const nx=document.getElementById('nx');
  nx.onclick=()=>{S.i++; last?finish():ask()};
  document.getElementById('objopen').onclick=()=>objection(q);
}

/* Ένσταση μαθητή για μια ερώτηση: πάει στο φύλλο «Ενστάσεις» του καθηγητή, δεν αλλάζει το σκορ */
const WHY=[['other','Νομίζω ότι σωστή είναι άλλη απάντηση'],['unclear','Η ερώτηση δεν είναι σαφής'],['ex','Η εξήγηση δεν μου φαίνεται σωστή'],['misc','Άλλο']];
function objection(q){
  const box=document.getElementById('obj');
  box.innerHTML=`<div class="objf"><b>Τι δεν σου κάθεται;</b>
    ${WHY.map(([k,t],i)=>`<label><input type="radio" name="why" value="${k}" ${i===0?'checked':''}> ${t}</label>`).join('')}
    <textarea id="objtxt" maxlength="300" rows="3" placeholder="Γράψε με λόγια τι σκέφτεσαι (προαιρετικό)"></textarea>
    <div class="objrow"><button class="btn sm" id="objsend">Στείλε την ένσταση</button><button class="link" id="objcancel">Άκυρο</button></div></div>`;
  document.getElementById('objcancel').onclick=()=>{box.innerHTML=`<button class="link objbtn" id="objopen">✋ Διαφωνώ με την απάντηση</button>`;document.getElementById('objopen').onclick=()=>objection(q);};
  document.getElementById('objsend').onclick=async()=>{
    const why=(box.querySelector('input[name=why]:checked')||{}).value||'misc', t=document.getElementById('objtxt').value.trim().slice(0,300);
    const b=document.getElementById('objsend'); b.disabled=true; b.textContent='Στέλνω…';
    try{await saving; await API.report(U.nick,U.pin,S.round,q.id,why,t);
      box.innerHTML=`<p class="objok">Ευχαριστώ! Η ένστασή σου στάλθηκε και ο καθηγητής θα την ελέγξει. Το σκορ σου δεν αλλάζει.</p>`;}
    catch(e){b.disabled=false;b.textContent='Δοκίμασε ξανά';}
  };
}

async function finish(){
  app.innerHTML=`<div class="mascot-row"><div id="mascot">${mascot('idle')}</div><div class="bubble">Μετράω τους πόντους σου…</div></div>`;
  const before=U.profile;
  let res=null;
  try{await saving; res=await API.finish(U.nick,U.pin,S.round,getCh()); U.profile=res.profile;}catch(e){}
  const score=res?res.score:S.score;
  const mcOk=S.log.filter(x=>x.ok&&x.type==='mc').length, tfOk=S.log.filter(x=>x.ok&&x.type==='tf').length;
  const p=U.profile, gained=res?p.photons-before.photons:0, tierUp=gained>0&&p.level.t>before.level.t;
  const mood=score>=20?'cheer':score>=13?'happy':'sad';
  const say=score===25?'25/25! Τέλειος γύρος, τρία φωτόνια!':score>=20?'Πολύ δυνατός γύρος, δύο φωτόνια!':score>=13?'Μπράβο, κέρδισες φωτόνιο! Από 20 και πάνω παίρνεις δύο.':score===12?'Στο όριο! Με μία μονάδα ακόμα έπαιρνες φωτόνιο.':'Δεν πειράζει. Οι λάθος θα ξανάρθουν για ρεβάνς, κι εσύ θα είσαι έτοιμος.';
  app.innerHTML=`
  <div class="top"><div class="brand">${LOGO}<span>Φωτόνιο</span> Quiz</div>${PH(p.photons)}</div>
  <div class="mascot-row"><div id="mascot">${mascot(mood)}</div><div class="bubble">${say}</div></div>
  <div class="card pop">
    <div class="big">${score}<small>/25</small></div><div class="note" style="text-align:left">πόντοι σε αυτόν τον γύρο</div>
    <div class="stats"><div class="stat"><b>${mcOk}/4</b><span>πολλαπλής</span></div><div class="stat"><b>${tfOk}/5</b><span>Σωστό/Λάθος</span></div><div class="stat"><b>${S.maxStreak}</b><span>μέγιστο σερί</span></div></div>
    ${gained>0?`<div class="win"><div class="plus">+${gained}</div><span>${gained===1?'Κέρδισες ένα φωτόνιο!':`Κέρδισες ${gained} φωτόνια!`} Τώρα έχεις <b>${p.photons}</b>.</span></div>`
              :`<p class="note" style="text-align:left;margin:0 0 6px">13 μονάδες και πάνω: 1 φωτόνιο. 20 και πάνω: 2. Χωρίς λάθος: 3.</p>`}
    ${segBar(p.level.t===10?10:p.level.into,gained>0&&!tierUp)}
    <div class="next" style="margin-top:6px">${nextLine(p.level)}</div>
    <div style="height:14px"></div>
    <ul class="log">${S.log.map(x=>`<li><span class="d ${x.ok?'g':'r'}"></span>${x.type==='mc'?'Πολλαπλής':'Σωστό/Λάθος'}<em>${esc(x.ch)}${x.kind==='retry'?' · ρεβάνς':''}</em></li>`).join('')}</ul>
    <div style="height:14px"></div>
    <button class="btn" id="again">Κι άλλος γύρος</button>
    <button class="btn ghost" id="home">Το φωτόνιό μου</button>
  </div>
  ${res?'':'<p class="note">Δεν υπήρχε σύνδεση: ο γύρος ίσως δεν αποθηκεύτηκε.</p>'}`;
  document.getElementById('again').onclick=()=>{app.innerHTML='<button class="btn" id="play" disabled>Ετοιμάζω τον γύρο…</button>';startRound()};
  document.getElementById('home').onclick=()=>lobby('back');
  if(tierUp)setTimeout(()=>achievement(p),700);
}

/* ---------- Νέα βαθμίδα ---------- */
function achievement(p){
  const L=p.level, ov=document.createElement('div');
  ov.className='ov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-label','Νέα βαθμίδα');
  ov.innerHTML=`<div class="ovcard pop">
    <div class="pill">ΝΕΑ ΒΑΘΜΙΔΑ</div>
    <div class="hero big">${tierHero(p.photons)}</div>
    <h2>Συγχαρητήρια, ${esc(U.nick)}!</h2>
    <p class="lead">Άλλο ένα βήμα πιο κοντά στο «φως».</p>
    <div class="tiername">${L.t===10?'«Φως»':esc(L.name)}</div>
    <p class="note">${p.photons} φωτόνια · ξεκλείδωσες: ${L.unlock}</p>
    <button class="btn" id="ovshare">Κοινοποίηση</button>
    <button class="btn ghost" id="ovok">Συνέχεια</button>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#ovok').onclick=()=>ov.remove();
  ov.querySelector('#ovshare').onclick=()=>{ov.remove();share(true)};
  ov.querySelector('#ovok').focus();
}

/* ---------- Κοινοποίηση: εικόνα 1080×1350 για Instagram/stories ---------- */
function svgToImg(svg){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}
async function shareImage(p,isAch){
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  try{await document.fonts.ready}catch(e){}
  const F='Inter, system-ui, sans-serif';
  g.fillStyle='#0F1B2D';g.fillRect(0,0,W,H);
  const rg=g.createRadialGradient(W/2,560,40,W/2,560,620);rg.addColorStop(0,'rgba(245,184,65,'+(0.08+0.03*p.level.t)+')');rg.addColorStop(1,'rgba(245,184,65,0)');g.fillStyle=rg;g.fillRect(0,0,W,H);
  g.strokeStyle='#2E4566';g.lineWidth=4;g.strokeRect(40,40,W-80,H-80);
  const logo=await svgToImg(LOGO.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" '));
  // πάνω αριστερά: λογότυπο · πάνω δεξιά: by @fotonio.physics
  g.drawImage(logo,88,92,80,80);
  g.textBaseline='middle';g.textAlign='left';g.fillStyle='#EEF2F8';g.font='800 46px '+F;g.fillText('ΦΩΤΟΝΙΟ',186,114);
  g.fillStyle='#F5B841';g.fillText('QUIZ',186,160);
  g.textAlign='right';g.fillStyle='#3FC1C9';g.font='700 32px '+F;g.fillText('@fotonio.physics',W-88,134);
  // όνομα παίκτη πάνω από τη φιγούρα (ποτέ πάνω της: η φιγούρα ξεκινά από κάτω του)
  g.textAlign='center';
  let ns=60;g.font='800 '+ns+'px '+F;while(g.measureText(U.nick).width>860&&ns>34){ns-=4;g.font='800 '+ns+'px '+F}
  g.fillStyle='#EEF2F8';g.fillText(U.nick,W/2,318);
  // φιγούρα στο κέντρο
  const hs0=tierHero(p.photons), v0=hs0.match(/viewBox="([^"]+)"/)[1].split(' ').map(Number), pd=60;
  const vb=[v0[0]-pd,v0[1]-pd,v0[2]+2*pd,v0[3]+2*pd], hs=hs0.replace(/viewBox="[^"]+"/,'viewBox="'+vb.join(' ')+'"');
  let hw=980,hh=Math.round(hw*vb[3]/vb[2]);if(hh>690){hh=690;hw=Math.round(hh*vb[2]/vb[3])}
  const hero=await svgToImg(hs.replace('<svg ',`<svg width="${hw}" height="${hh}" `));
  g.drawImage(hero,(W-hw)/2,360+(690-hh)/2,hw,hh);
  // κάτω: βαθμίδα και, δίπλα, διακριτικά τα φωτόνια
  const tn=p.level.t===10?'«Φως»':p.level.name, pt=p.photons+(p.photons===1?' φωτόνιο':' φωτόνια');
  let ts=88;const pf='800 36px '+F;g.font=pf;const ptw=g.measureText(pt).width,pw=ptw+56,gap=30;
  g.font='800 '+ts+'px '+F;while(g.measureText(tn).width+gap+pw>900&&ts>48){ts-=4;g.font='800 '+ts+'px '+F}
  const tw=g.measureText(tn).width,x0=(W-(tw+gap+pw))/2,yL=1110;
  g.textAlign='left';g.fillStyle='#F5B841';g.fillText(tn,x0,yL);
  const px=x0+tw+gap,ph=62,py=yL-ph/2+4;
  g.beginPath();if(g.roundRect)g.roundRect(px,py,pw,ph,31);else g.rect(px,py,pw,ph);
  g.save();g.shadowColor='rgba(245,184,65,0.55)';g.shadowBlur=24;g.fillStyle='rgba(245,184,65,0.18)';g.fill();g.restore();g.strokeStyle='#F5B841';g.lineWidth=3;g.stroke();
  g.font=pf;g.fillStyle='#FFD36E';g.fillText(pt,px+28,py+ph/2+2);
  g.textAlign='center';g.fillStyle='#9FB0C4';g.font='600 32px '+F;g.fillText('Μπορείς να φτάσεις πιο κοντά στο «φως»;',W/2,1232);
  return await new Promise(r=>c.toBlob(r,'image/png'));
}
async function share(isAch){
  const p=U.profile, L=p.level, url=U.url||'';
  const text=(isAch?`Έφτασα στη βαθμίδα «${L.name}» στο Φωτόνιο Quiz με ${p.photons} φωτόνια!`:`Έχω ${p.photons} φωτόνια στο Φωτόνιο Quiz (βαθμίδα «${L.name}»).`)
    +' Πόσο κοντά στο «φως» μπορείς να φτάσεις εσύ; Παίξε κι εσύ: @fotonio.physics';
  let blob=null;try{blob=await shareImage(p,isAch)}catch(e){}
  const file=blob?new File([blob],'fotonio-quiz.png',{type:'image/png'}):null;
  const img=blob?await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r('');f.readAsDataURL(blob)}):'';
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="ovcard pop">
    <div class="pill">ΚΟΙΝΟΠΟΙΗΣΗ</div>
    ${img?`<img class="shot" src="${img}" alt="Η κάρτα του φωτονίου σου">`:''}
    <button class="btn" id="shr">Κοινοποίηση</button>
    ${blob?`<button class="btn ghost" id="cpi">Αντιγραφή εικόνας</button>
    <a class="link" id="dl" href="${img}" download="fotonio-quiz.png">Αποθήκευση εικόνας</a>`:''}
    <p class="note" id="shmsg">Στην κοινοποίηση διάλεξε Instagram, Facebook, TikTok ή όποια εφαρμογή θέλεις, για story ή post.</p>
    <button class="link" id="cl">Κλείσιμο</button>
  </div>`;
  document.body.appendChild(ov);
  const msg=t=>{ov.querySelector('#shmsg').textContent=t};
  ov.querySelector('#cl').onclick=()=>ov.remove();
  ov.querySelector('#shr').onclick=async()=>{
    const full={text:text+(url?' '+url:'')};
    try{
      if(file&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share(Object.assign({files:[file]},full));return;}
      if(navigator.share){await navigator.share(full);msg('Στάλθηκε μόνο το κείμενο. Για story, αποθήκευσε την εικόνα και ανέβασέ τη από την εφαρμογή.');return;}
    }catch(e){ if(e&&e.name==='AbortError')return; }
    msg('Η κοινοποίηση δεν άνοιξε σε αυτό το πρόγραμμα περιήγησης. Πάτα «Αποθήκευση εικόνας» ή κράτα πατημένη την εικόνα, και ανέβασέ τη σε story από το Instagram, το Facebook ή το TikTok.');
  };
  const dl=ov.querySelector('#dl'); if(dl)dl.addEventListener('click',()=>setTimeout(()=>msg('Αν η εικόνα δεν κατέβηκε, κράτα πατημένη την εικόνα πάνω και διάλεξε «Αποθήκευση εικόνας».'),400));
  const cpi=ov.querySelector('#cpi');
  if(cpi)cpi.onclick=async()=>{
    try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);cpi.textContent='Η εικόνα αντιγράφηκε!';msg('Κάνε επικόλληση σε story, μήνυμα ή post.');}
    catch(e){cpi.textContent='Κράτα πατημένη την εικόνα';msg('Εδώ η αντιγραφή με κουμπί δεν επιτρέπεται. Κράτα πατημένη την εικόνα πάνω και διάλεξε «Αντιγραφή» ή «Αποθήκευση εικόνας».');}
  };
}

login();
