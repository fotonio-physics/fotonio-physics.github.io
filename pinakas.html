<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Φωτόνιο · Πίνακας καθηγητή</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
<style>
:root{
  --bg:#0F1B2D; --card:#16263D; --card2:#1B2E49; --bor:#2E4566; --ban:#F5B841; --teal:#3FC1C9;
  --txt:#EEF2F8; --soft:#C9D3E0; --mut:#9FB0C4; --dim:#7F93AD;
  --redb:#F0525F; --grnb:#2F8F72;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--f);font-size:15px;line-height:1.45}
body{padding:max(16px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--ban);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:44px;flex:0 0 44px}
.bt{font-weight:800;letter-spacing:.06em;line-height:1.05;font-size:20px}
.bt b{color:var(--ban)} .bt small{display:block;font-weight:600;letter-spacing:.02em;color:var(--mut);font-size:13px;margin-top:4px}
.upd{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.rf{border:1px solid var(--bor);border-radius:999px;padding:7px 14px;font-weight:600;color:var(--txt);background:var(--card)}
.rf.spin{opacity:.6}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grnb);box-shadow:0 0 0 3px rgba(47,143,114,.25)}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpis.now{grid-template-columns:1fr}
.kpi{background:var(--card);border:1px solid var(--bor);border-radius:16px;padding:14px 14px 12px}
.kpi.live{grid-column:1/-1;border-color:rgba(63,193,201,.55);display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:center}
.kpi.live .l{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.kpi.live .v{color:var(--teal);font-size:40px}
.kpi.live .s{margin-top:0}
.kpi.live .dot{width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(63,193,201,.6)}
@media (prefers-reduced-motion:no-preference){.kpi.live .dot{animation:livep 1.8s ease-out infinite}@keyframes livep{to{box-shadow:0 0 0 9px rgba(63,193,201,0)}}}
.kpi .l{color:var(--mut);font-size:12.5px;font-weight:600;letter-spacing:.02em}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v.gold{color:var(--ban)}
.kpi .s{color:var(--dim);font-size:12.5px;margin-top:2px}
.kpi .s b{color:var(--teal);font-weight:700}

.grid2{display:grid;gap:16px;align-items:start}
@media(min-width:900px){.grid2{grid-template-columns:1.25fr 1fr}}
.card{background:var(--card);border:1px solid var(--bor);border-radius:18px;padding:16px}
.card h2{font-size:16px;margin:0 0 2px;font-weight:800}
.cardh{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.cardh h2{margin:0}
.chev{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--teal);border:1px solid var(--bor);border-radius:999px;padding:5px 12px;white-space:nowrap}
.chev i{font-style:normal}
.cardh.foot{justify-content:center;margin-top:12px;border:1px solid var(--bor);border-radius:12px;padding:10px;font-size:13.5px;font-weight:700;color:var(--teal)}
button.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.kpi.go:hover,.kpi.go:focus-visible{border-color:var(--teal)}
.kpi .arr{float:right;color:var(--teal);font-weight:800}
.card{scroll-margin-top:12px}
@media (prefers-reduced-motion:no-preference){.flash{animation:flash 1.4s ease-out}@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--teal)}100%{box-shadow:0 0 0 0 rgba(63,193,201,0)}}}
.card .sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.card>.cardh{min-height:32px}
.card .sb{margin-top:6px}
.card.cl{padding-bottom:12px}
.card .sub.cs{margin:6px 0 0}
.chev{min-width:34px;justify-content:center;font-size:14px}
.card .sb>.kpis{margin-top:4px}
/* δραστηριότητα ανά ώρα */
.hm{display:grid;grid-template-columns:22px repeat(24,minmax(0,1fr));gap:2px;align-items:center}
.hm .rl{font-size:11px;color:var(--mut);font-weight:600}
.hm .c{height:18px;border-radius:3px;background:var(--bg);border:1px solid rgba(46,69,102,.45)}
.hm .c.z{border-color:rgba(46,69,102,.25)}
.hm .hl{font-size:9.5px;color:var(--dim);text-align:left;white-space:nowrap;overflow:visible}
.hleg{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);margin-top:10px}
.hleg i{display:block;width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(63,193,201,.15),rgba(63,193,201,1))}
.toph{display:grid;gap:12px;margin-top:14px}
@media(min-width:560px){.toph{grid-template-columns:1fr 1fr}}
.toph>div{background:var(--bg);border:1px solid var(--bor);border-radius:12px;padding:10px 12px}
.toph h4{margin:0 0 6px;font-size:12.5px;color:var(--mut);font-weight:700}
.toph ol{margin:0;padding-left:20px;font-size:14px}.toph li{padding:2px 0}.toph li b{font-variant-numeric:tabular-nums}.toph li span{color:var(--dim);font-size:12.5px}
.act.a24{gap:2px;height:140px;margin-top:22px}.act.a24 .b{max-width:none;border-radius:3px 3px 0 0;background:var(--teal)}
.axis.a24{gap:2px}.axis.a24 span{font-size:9.5px;text-align:left;overflow:visible;white-space:nowrap}
.dsel{background:var(--bg);color:var(--txt);border:1px solid var(--bor);border-radius:999px;padding:7px 12px;font:inherit;font-size:13.5px;max-width:100%}
.sprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.spn{border:1px solid rgba(245,184,65,.5);background:rgba(245,184,65,.1);color:var(--ban);border-radius:12px;padding:8px 12px;font-size:13px;margin-top:10px}
.spl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.spl span{border:1px solid var(--bor);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--soft)}
.h4{font-size:14px;margin:16px 0 6px;font-weight:800}
/* πιο δύσκολη της εβδομάδας */
.wo{display:grid;grid-template-columns:22px 1fr 76px;gap:8px;align-items:center;font-size:13.5px;color:var(--soft);padding:6px 0;border-top:1px solid rgba(46,69,102,.5)}
.wo b{color:var(--mut)}.wo .wt{height:6px;border-radius:3px;background:var(--card);overflow:hidden;margin-top:4px}.wo .wt i{display:block;height:100%;background:var(--dim)}
.wo .wn{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--mut)}
.wo.r{color:var(--txt)}.wo.r b,.wo.r .wn{color:var(--grnb);font-weight:800}.wo.r .wt i{background:var(--grnb)}
.wo em{font-style:normal;font-size:11px;font-weight:800;color:var(--grnb);margin-left:6px}
.wq.pick{border-color:var(--ban);box-shadow:0 0 0 1px var(--ban)}.wq.pick .rkb{color:var(--ban)}
.ab.sel{background:var(--ban);color:var(--bg);border-color:var(--ban)}
.rkb{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--ban);text-transform:uppercase}
/* πηγές */
.srt2{width:100%;border-collapse:collapse;font-size:13.5px}
.srt2 th{text-align:left;font-size:11.5px;color:var(--dim);font-weight:700;padding:4px 6px;border-bottom:1px solid var(--bor)}
.srt2 td{padding:8px 6px;border-bottom:1px solid rgba(46,69,102,.5);font-variant-numeric:tabular-nums}
.srt2 td.n,.srt2 th.n{text-align:right}
.srt2 .trk{margin-top:4px;height:6px}
.lnk{margin-top:12px;font-size:12.5px;color:var(--mut);line-height:1.7}.lnk code{color:var(--teal);font-size:12px;word-break:break-all}

/* δραστηριότητα */
.act{position:relative;height:150px;display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--bor);padding-top:18px}
.act .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.act .b{width:100%;max-width:26px;background:var(--ban);border-radius:4px 4px 0 0;min-height:0}
.act .b.z{background:var(--bor);height:2px!important;border-radius:2px}
.act .n{position:absolute;font-size:11px;color:var(--soft);font-weight:600;transform:translateY(-16px)}
.axis{display:flex;gap:4px;margin-top:6px}
.axis span{flex:1;text-align:center;font-size:10.5px;color:var(--dim)}
.tip{position:fixed;z-index:20;pointer-events:none;background:#0B1424;border:1px solid var(--bor);border-radius:10px;padding:7px 10px;font-size:12.5px;color:var(--txt);box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;white-space:nowrap}

/* κεφάλαια */
.hb{display:grid;grid-template-columns:44% 1fr 44px;align-items:center;gap:10px;padding:6px 0}
.hb .nm{font-size:13.5px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk{height:10px;background:#0F1B2D;border-radius:5px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--teal);border-radius:0 4px 4px 0}
.hb .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px}
.hb .pc small{display:block;color:var(--dim);font-weight:500;font-size:11px}
.hb.none .nm,.hb.none .pc{color:var(--dim)}

/* παίκτες */
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.seg button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap;border:1px solid var(--bor);background:#0F1B2D}
.seg button.on{background:var(--ban);border-color:var(--ban);color:#1B1300}
.seg{align-items:center}.sl2{font-size:11.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;width:100%}
.seg.per button.on{background:var(--teal);border-color:var(--teal);color:#06202A}
.tg{border:1px solid var(--bor);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--mut)}
.tg.on{border-color:var(--teal);color:var(--teal)}
.srch{flex:1;min-width:140px;background:#0F1B2D;border:1px solid var(--bor);border-radius:999px;padding:7px 14px;color:var(--txt);font:inherit;font-size:13.5px}
.pl{display:flex;flex-direction:column;gap:8px}
.p{background:var(--card2);border:1px solid var(--bor);border-radius:14px}
.p>button{width:100%;text-align:left;display:grid;grid-template-columns:22px 44px 1fr;grid-template-areas:'rk hero info' 'rk hero nums';column-gap:10px;row-gap:6px;align-items:center;padding:10px 12px}
.p .rk{grid-area:rk}.p .hero{grid-area:hero}.p .info{grid-area:info}.p .nums{grid-area:nums;justify-content:flex-start}
.p .nums div{align-items:flex-start}
@media(min-width:640px){.p>button{grid-template-columns:28px 52px 1fr auto;grid-template-areas:'rk hero info nums';column-gap:14px;padding:10px 14px}.p .nums{justify-content:flex-end}.p .nums div{align-items:flex-end}}
.rk{color:var(--dim);font-weight:800;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.rk.g{color:var(--ban)}
.hero{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.hero svg{max-width:44px;max-height:44px}
.nk{font-weight:800;font-size:15.5px;display:flex;align-items:center;gap:6px}
.nk .nm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new{flex:0 0 auto}
.new.tst{background:none;border:1px solid var(--bor);color:var(--mut)}
.new{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#0B2427;background:var(--teal);border-radius:999px;padding:1px 7px}
.meta{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .tier{color:var(--ban);font-weight:700}
.nums{display:flex;gap:18px}
.nums div{display:flex;flex-direction:column;align-items:flex-end}
.nums b{font-size:16px;line-height:1.1;font-variant-numeric:tabular-nums}
.nums b.gold{color:var(--ban)}
.nums span{font-size:11px;color:var(--dim)}
.det{display:none;border-top:1px solid var(--bor);padding:12px 14px 14px;gap:14px}
.p.open .det{display:grid}
@media(min-width:760px){.p.open .det{grid-template-columns:1fr 1fr}}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{background:#0F1B2D;border-radius:10px;padding:8px 10px}
.mini span{display:block;font-size:11.5px;color:var(--mut)}
.mini b{font-size:16px;font-variant-numeric:tabular-nums}
.spk{margin-top:10px}
.spk .sl{font-size:12px;color:var(--mut);margin-bottom:4px}
.weak{margin-top:8px;font-size:13px;color:var(--soft)}
.weak b{color:var(--redb)}
.empty{color:var(--dim);font-size:13.5px;padding:8px 2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.kpi.sunkpi{grid-column:1/-1;border-color:rgba(245,184,65,.6);box-shadow:0 0 18px rgba(245,184,65,.12)}
.winl{margin-top:10px}
.winc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--bor);border-radius:999px;padding:4px 10px;margin:0 6px 6px 0;font-size:13px;font-weight:700;background:var(--bg)}
.winc i{color:var(--ban);font-style:normal}
.pstar{color:var(--ban);font-style:normal}
.sunnext{margin-top:12px;border-top:1px solid var(--bor);padding-top:10px}
.nomix{border:1px solid var(--bor);border-radius:999px;padding:1px 8px;font-size:11.5px;color:var(--soft)}
.h3{font-size:15px;margin:16px 0 4px}
.chprev{margin-top:8px;border:1px solid var(--bor);border-radius:12px;padding:10px 12px;background:var(--bg)}
.cpo{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;font-size:13.5px;color:var(--soft);padding:5px 0;border-top:1px solid rgba(46,69,102,.5)}
.cpo:first-of-type{margin-top:6px}.cpo b{color:var(--mut)}.cpo em{font-style:normal;font-size:11.5px;font-weight:800;color:var(--grnb)}
.cpo.r{color:var(--grnb);font-weight:700}.cpo.r b{color:var(--grnb)}
.wq{border:1px solid var(--bor);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--bg)}
.wh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.werr{color:var(--redb);font-size:14px}
.wtx{font-size:13.5px;color:var(--soft);margin-top:4px;line-height:1.45}
.wbars{display:grid;gap:4px;margin-top:8px}
.wb{display:grid;grid-template-columns:34px 1fr 38px;gap:8px;align-items:center;font-size:12.5px;color:var(--mut)}
.wb .wt{height:8px;border-radius:4px;background:var(--card);overflow:hidden}.wb .wt i{display:block;height:100%;background:var(--dim)}
.wb.r{color:var(--grnb);font-weight:800}.wb.r .wt i{background:var(--grnb)}
.wp{text-align:right;font-variant-numeric:tabular-nums}
.ab.sure{background:var(--ban);color:var(--bg);border-color:var(--ban)}
.msg2{min-height:1.2em;margin-top:6px;font-size:13px;color:var(--ban)}
.sunk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.sunk div{background:var(--bg);border:1px solid var(--bor);border-radius:12px;padding:10px;text-align:center}
.sunk b{display:block;font-size:24px;font-weight:800}.sunk b.gold{color:var(--ban)}.sunk span{font-size:12px;color:var(--mut)}
.ab{border:1px solid var(--bor);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--ban);background:var(--bg)}
.ab.t{color:var(--teal)} .ab:disabled{opacity:.5}
.idrow{display:flex;gap:8px;margin-top:4px}
.ov{position:fixed;inset:0;background:rgba(6,12,22,.86);z-index:20;overflow:auto;padding:14px;display:flex;align-items:flex-start;justify-content:center}
.ed{background:var(--card);border:1px solid var(--bor);border-radius:18px;padding:16px;width:100%;max-width:640px;margin:auto}
.ed h2{margin:0 0 2px;font-size:18px} .ed .sub{color:var(--mut);font-size:12.5px;margin-bottom:10px}
.ed label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:12px 0 4px}
.ed textarea,.ed select{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--bor);border-radius:10px;padding:9px 11px;font:inherit;font-size:14.5px;line-height:1.4}
.ed textarea{resize:vertical;min-height:44px}
.ed .or{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;margin-bottom:6px}
.ed .or b{width:28px;height:28px;border-radius:50%;background:var(--teal);color:var(--bg);display:grid;place-items:center;font-size:13px;margin-top:7px}
.ed .or.r textarea{border-color:var(--grnb);box-shadow:0 0 0 1px var(--grnb)}
.ed .ck{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--soft)}
.ed .ck input{width:20px;height:20px;accent-color:var(--ban)}
.ed .bts{display:flex;gap:10px;margin-top:16px}
.ed .bts button{flex:1;border-radius:12px;padding:12px;font-weight:800}
.ed .sv{background:var(--ban);color:var(--bg)} .ed .cn{border:1px solid var(--bor)}
.ed .msg{min-height:1.4em;margin-top:10px;font-size:13.5px;color:var(--ban)}
.ed .hint{font-size:12px;color:var(--dim);margin-top:4px}

/* ερωτήσεις / ενστάσεις */
.q{padding:10px 0;border-bottom:1px solid var(--bor);display:grid;grid-template-columns:54px 1fr;gap:12px}
.q:last-child{border-bottom:0}
.q .e{font-size:18px;font-weight:800;color:var(--redb);font-variant-numeric:tabular-nums;text-align:right}
.q .e small{display:block;font-size:10.5px;color:var(--dim);font-weight:500}
.q .t{font-size:13.5px;color:var(--soft)}
.q .t .m{display:block;font-size:11.5px;color:var(--dim);margin-top:3px}
.off{font-size:10.5px;font-weight:700;color:var(--dim);border:1px solid var(--bor);border-radius:999px;padding:0 6px;margin-left:4px}
.ob{padding:10px 0;border-bottom:1px solid var(--bor);font-size:13.5px}
.ob:last-child{border-bottom:0}
.ob .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:12.5px}
.ob .h b{color:var(--txt)}
.pill{font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 8px}
.pill.o{background:rgba(245,184,65,.15);color:var(--ban);border:1px solid rgba(245,184,65,.5)}
.pill.d{color:var(--dim);border:1px solid var(--bor)}
.ob .w{color:var(--soft);margin-top:3px}
.ob .x{color:var(--dim);font-size:12.5px;margin-top:2px}
.newl{display:flex;flex-wrap:wrap;gap:6px}
.newl span{background:#0F1B2D;border:1px solid var(--bor);border-radius:999px;padding:4px 10px;font-size:13px}
.newl small{color:var(--dim)}
.err{background:#3A1A24;border:1px solid var(--redb);color:#FFD6DA;border-radius:14px;padding:14px}
.load{color:var(--mut);text-align:center;padding:40px 0}

.dvtg{display:flex;background:var(--bg);border:1px solid var(--bor);border-radius:999px;padding:3px;gap:3px;margin-bottom:12px;max-width:360px}
.dvtg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;font-size:13px;border-radius:999px;padding:6px;cursor:pointer}
.dvtg button.on{background:var(--ban);color:var(--bg)}
.dvk{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:720px){.dvk{grid-template-columns:repeat(4,1fr)}}
.dvk div{background:var(--bg);border:1px solid var(--bor);border-radius:12px;padding:10px 8px;text-align:center}
.dvk b{display:block;font-size:24px;color:var(--ban)}.dvk span{font-size:12px;color:var(--mut);line-height:1.25;display:block}
.dvh{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:16px 0 8px}
.dvf,.dvp{display:flex;flex-direction:column;gap:6px}
.dvf div{display:grid;grid-template-columns:110px 1fr 74px;gap:8px;align-items:center;font-size:13px}
.dvf i{height:14px;border-radius:7px;background:var(--teal);display:block;min-width:3px}
.dvf em,.dvp em{font-style:normal;text-align:right;color:var(--soft,#C9D3E0)}.dvf em small{color:var(--mut)}
.dvp div{display:grid;grid-template-columns:100px 1fr 1fr 60px;gap:8px;align-items:center;font-size:13px}
.dvp i{height:12px;border-radius:6px;display:block;min-width:3px}.dvp .s{background:var(--ban)}.dvp .a{background:var(--teal)}.dvp em{font-size:12px}
.dvl{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-bottom:8px}.dvl span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.dvr{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dvr div{background:var(--bg);border:1px solid var(--bor);border-radius:12px;padding:10px;text-align:center}
.dvr b{display:block;font-size:22px;color:var(--soft,#C9D3E0)}.dvr span{font-size:12px;color:var(--mut)}
b.tl{color:var(--teal)}b.am{color:var(--ban)}

<script>
/* ---------- Το Φωτόνιο του παίκτη ανάλογα με τα φωτόνια (βαθμίδα ανά 10) ---------- */
function tierHero(n){
  const uid='u'+Math.random().toString(36).slice(2,7);
  /* Κάθε δεκάδα ξεκλειδώνει κάτι καινούριο που φαίνεται καθαρά:
     0 μισόκλειστα μάτια στο σκοτάδι · 10 ανοίγει τα μάτια, πρώτη σπίθα · 20 λαμπερό περίγραμμα, μάγουλα, χαιρετά
     30 ακτίνες φωτός · 40 οι ακτίνες γυρίζουν, φωτεινή ουρά · 50 σπίθες, φωτοστέφανο, σηκώνει τα χέρια
     60 φωτόνιο σε τροχιά · 70 πρώτη φλόγα · 80 χρυσές ακτίνες, μεγαλύτερη φλόγα · 90 διπλή αύρα · 100 πλήρης φλόγα «φως» */
  const t=Math.min(10,Math.floor(n/10));
  const T='#3FC1C9',A='#F5B841',N='#0F1B2D';
  const body=['#0B1320','#132541','#18304F','#1C3A5E','#21446D','#264E7C','#2A588A','#2E6297','#326CA4','#3776B0','#3C80BC'][t];
  const bright=[.5,.72,.84,.92,1,1,1,1,1,1,1][t];
  const glow=[0,3,7,10,13,16,18,20,22,24,26][t];
  let back='', crown='', front='';
  // ακτίνες φωτός πίσω από το σώμα
  if(t>=3){
    const L=t>=8?32:t>=5?28:t>=4?24:16, c=t>=8?'#FFD36B':A, cnt=t>=8?16:12;
    let r='';for(let i=0;i<cnt;i++){const a=i*360/cnt*Math.PI/180;r+=`<line x1="${(150+76*Math.sin(a)).toFixed(1)}" y1="${(115-76*Math.cos(a)).toFixed(1)}" x2="${(150+(76+L)*Math.sin(a)).toFixed(1)}" y2="${(115-(76+L)*Math.cos(a)).toFixed(1)}" stroke="${c}" stroke-width="${t>=8?5:4}" stroke-linecap="round" opacity="${t>=8?.85:.6}"/>`;}
    back+=`<g class="${t>=4?'spin':''}">${r}</g>`;
  }
  // φωτοστέφανο / αύρα
  if(t>=5) back+=`<circle class="halo" cx="150" cy="115" r="${t>=9?84:78}" fill="none" stroke="${A}" stroke-width="3" opacity=".7" stroke-dasharray="${t>=9?'':'6 8'}"/>`;
  if(t>=9) back+=`<circle class="halo" cx="150" cy="115" r="96" fill="none" stroke="${T}" stroke-width="2.5" opacity=".6" style="animation-delay:-1.2s"/>`;
  // πρώτη σπίθα (10–49)
  if(t>=1&&t<5) front+=`<path class="twinkle" d="M206 52 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#FFF3D1"/>`;
  // σπίθες που ανεβαίνουν (50+)
  if(t>=5){
    const ns=t>=7?5:t>=6?4:3;
    const sp=[[-26,40,'#FFF3D1',3.4,-.2],[22,44,A,3.2,-1.0],[-6,34,T,3,-.6],[34,52,'#FFF3D1',2.8,-1.4],[-38,54,A,3,-.9]];
    for(let i=0;i<ns;i++){const [dx,y,c,r,d]=sp[i];front+=`<circle class="spark" cx="${150+dx}" cy="${y}" r="${r}" fill="${c}" style="animation-delay:${d}s"/>`;}
  }
  // φωτόνια σε τροχιά (60+)
  if(t>=6){const no=t>=10?3:t>=7?2:1;for(let i=0;i<no;i++)front+=`<g class="orbit" style="animation-delay:${-i*1.3}s"><circle cx="150" cy="${115-90}" r="6" fill="${i%2?T:A}"/><circle cx="150" cy="${115-90}" r="11" fill="${i%2?T:A}" opacity=".25"/></g>`;}
  // φλόγα (70+)
  if(n>=70){
    /* μία ενιαία φλόγα σαν το 🔥: κεντρική ψηλή γλώσσα με δύο μικρότερες στα πλάγια, στρώσεις χρώματος από μέσα προς τα έξω */
    const k2=n>=100?Math.min(1.15,1+(n-100)/400):n>=90?.88:n>=80?.76:.62;
    const H=96*k2+22, W=90*Math.min(1.05,.68+k2*.32);
    const P=(x,y)=>`${(x*W).toFixed(1)} ${(-y*H).toFixed(1)}`;
    const outer=`M${P(0,0)} C${P(-.62,0)} ${P(-.78,.36)} ${P(-.56,.62)} C${P(-.5,.5)} ${P(-.42,.46)} ${P(-.36,.5)} C${P(-.36,.66)} ${P(-.2,.82)} ${P(.02,1)} C${P(0,.86)} ${P(.12,.78)} ${P(.22,.74)} C${P(.24,.66)} ${P(.3,.62)} ${P(.44,.64)} C${P(.4,.58)} ${P(.7,.4)} ${P(.62,.22)} C${P(.56,.06)} ${P(.32,0)} ${P(0,0)}Z`;
    const drop=(sx,sy)=>`M${P(0,0)} C${P(-.5*sx,0)} ${P(-.55*sx,.4*sy)} ${P(-.08*sx,.98*sy)} C${P(-.04*sx,.7*sy)} ${P(.18*sx,.62*sy)} ${P(.3*sx,.48*sy)} C${P(.5*sx,.3*sy)} ${P(.42*sx,0)} ${P(0,0)}Z`;
    crown+=`<defs><linearGradient id="fo${uid}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F05A1A"/><stop offset=".6" stop-color="#F28A1E"/><stop offset="1" stop-color="${A}"/></linearGradient>
      <filter id="glo${uid}" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter></defs>
    <g transform="translate(150 96)">
      <path d="${outer}" fill="${A}" opacity=".35" filter="url(#glo${uid})"/>
      <g class="flame">
        <path d="${outer}" fill="url(#fo${uid})"/>
        <g transform="translate(0 ${(-H*.2).toFixed(1)})"><path class="fl b" d="${drop(.72,.62)}" fill="${A}"/>
        <path class="fl c" d="${drop(.42,.36)}" fill="#FFE9A6"/></g>
      </g>
    </g>`;
    }
  // στάση σώματος και πρόσωπο
  const sleepy=t===0;
  const armR=t>=5?`<path d="M206 106 Q228 88 222 62" fill="none" stroke="${T}" stroke-width="7" stroke-linecap="round"/><circle cx="222" cy="58" r="7" fill="${T}"/>`
           :t>=2?`<path d="M208 114 L236 100" fill="none" stroke="${T}" stroke-width="7" stroke-linecap="round"/><circle cx="238" cy="99" r="6.5" fill="${T}"/>`
           :`<path d="M198 152 Q192 172 172 160" fill="none" stroke="${T}" stroke-width="7" stroke-linecap="round"/><circle cx="168" cy="157" r="6.5" fill="${T}"/>`;
  const armL=t>=5?`<path d="M92 128 Q70 112 76 86" fill="none" stroke="${T}" stroke-width="7" stroke-linecap="round"/><circle cx="76" cy="82" r="7" fill="${T}"/>`
           :`<path d="M92 128 Q80 142 86 156" fill="none" stroke="${T}" stroke-width="7" stroke-linecap="round"/>`;
  const eyes=sleepy
    ?`<ellipse cx="132" cy="102" rx="12" ry="7" fill="#fff" opacity=".8"/><ellipse cx="168" cy="102" rx="12" ry="7" fill="#fff" opacity=".8"/><circle cx="133" cy="104" r="4" fill="${N}"/><circle cx="169" cy="104" r="4" fill="${N}"/><path d="M119 99 Q132 93 145 99 M155 99 Q168 93 181 99" stroke="${body}" stroke-width="5" fill="none"/>`
    :`<ellipse cx="132" cy="100" rx="12" ry="14" fill="#fff"/><ellipse cx="168" cy="100" rx="12" ry="14" fill="#fff"/><circle cx="134" cy="100" r="6" fill="${N}"/><circle cx="170" cy="100" r="6" fill="${N}"/><circle cx="137" cy="96" r="2" fill="#fff"/><circle cx="173" cy="96" r="2" fill="#fff"/>`;
  const mouth=t===0?`<path d="M142 130 Q150 128 158 130" fill="none" stroke="${A}" stroke-width="4" stroke-linecap="round" opacity=".8"/>`
            :t<2?`<path d="M140 126 Q150 136 160 126" fill="none" stroke="${A}" stroke-width="5" stroke-linecap="round"/>`
            :`<path d="M134 122 Q150 146 166 122 Z" fill="${A}"/>`;
  const cheeks=t>=2?`<circle cx="118" cy="122" r="7" fill="${A}" opacity=".35"/><circle cx="182" cy="122" r="7" fill="${A}" opacity=".35"/>`:'';
  const tail=t>=4?A:'#C9973A', tw=t>=4?6:4.5;
  const ring=t>=2?`drop-shadow(0 0 ${t>=6?8:5}px ${T})`:'';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 ${t>=7?-40:t>=3?-12:12} 270 ${t>=7?278:t>=3?250:212}" role="img" aria-label="Το Φωτόνιο με ${n} φωτόνια">
  <g class="float" style="filter:brightness(${bright}) drop-shadow(0 0 ${glow}px rgba(245,184,65,${(0.1+0.06*t).toFixed(2)}))">
  ${back}
  ${crown}
  <path d="M2.0 111.0 L5.0 111.0 L8.0 112.6 L11.0 115.6 L14.0 119.1 L17.0 122.0 L20.0 123.0 L23.0 121.6 L26.0 117.6 L29.0 112.2 L32.0 106.9 L35.0 103.5 L38.0 103.5 L41.0 107.1 L44.0 113.7 L47.0 121.4 L50.0 127.9 L53.0 130.9 L56.0 129.1 L59.0 122.7 L62.0 113.3 L65.0 103.8 L68.0 97.0 L71.0 95.3 L74.0 99.7 L77.0 109.1 L80.0 121.1 L83.0 131.9 L86.0 138.1 L87.5 138.8" fill="none" stroke="${tail}" stroke-width="${tw}" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="36" cy="112.6" r="3.2" fill="${A}"/><circle cx="70" cy="111" r="3.2" fill="${A}"/>
  <circle cx="150" cy="115" r="62" fill="${body}" stroke="${T}" stroke-width="7" style="filter:${ring}"/>
  ${armR}${armL}${eyes}${cheeks}${mouth}
  ${front}
  </g></svg>`;
}

let KEY='';
const LOGO=`<svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="82" fill="none" stroke="#3FC1C9" stroke-width="8"/><path d="M18.0 98.6 L20.0 95.5 L22.0 91.4 L24.0 87.2 L26.0 83.4 L28.0 80.7 L30.0 79.3 L32.0 79.6 L34.0 81.7 L36.0 85.7 L38.0 91.5 L40.0 100.0 L42.0 109.1 L44.0 116.3 L46.0 122.4 L48.0 127.1 L50.0 130.2 L52.0 131.5 L54.0 131.0 L56.0 128.6 L58.0 124.3 L60.0 118.3 L62.0 110.6 L64.0 100.0 L66.0 89.2 L68.0 80.9 L70.0 74.0 L72.0 68.8 L74.0 65.3 L76.0 63.8 L78.0 64.4 L80.0 67.1 L82.0 72.0 L84.0 78.9 L86.0 87.8 L88.0 100.0 L90.0 112.4 L92.0 121.9 L94.0 129.6 L96.0 135.3 L98.0 138.8 L100.0 140.0 L102.0 138.8 L104.0 135.3 L106.0 129.6 L108.0 121.9 L110.0 112.4 L112.0 100.0 L114.0 87.8 L116.0 78.9 L118.0 72.0 L120.0 67.1 L122.0 64.4 L124.0 63.8 L126.0 65.3 L128.0 68.8 L130.0 74.0 L132.0 80.9 L134.0 89.2 L136.0 100.0 L138.0 110.6 L140.0 118.3 L142.0 124.3 L144.0 128.6 L146.0 131.0 L148.0 131.5 L150.0 130.2 L152.0 127.1 L154.0 122.4 L156.0 116.3 L158.0 109.1 L160.0 100.0 L162.0 91.5 L164.0 85.7 L166.0 81.7 L168.0 79.6 L170.0 79.3 L172.0 80.7 L174.0 83.4 L176.0 87.2 L178.0 91.4 L180.0 95.5 L182.0 98.6" fill="none" stroke="#F5B841" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="76" cy="106" r="4.5" fill="#F5B841"/><circle cx="124" cy="106" r="4.5" fill="#F5B841"/></svg>`;
const CHS=["Κρούσεις", "Ταλαντώσεις", "Κύματα", "Ηλεκτρομαγνητικά κύματα", "Στερεό", "Μαγνητικό πεδίο", "Επαγωγή", "Κβαντομηχανική"];
/* Ποιες ενότητες είναι κλειστές: τις θυμάται αυτή η συσκευή */
let SEC=(()=>{let o={};try{o=JSON.parse(localStorage.getItem('fotonio_dash_sec')||'{}')||{};if(!('stucard' in o)&&localStorage.getItem('fotonio_dash_stu')==='0')o.stucard=1}catch(e){}return o})();
function setSec(id,closed){SEC[id]=closed?1:0;try{localStorage.setItem('fotonio_dash_sec',JSON.stringify(SEC))}catch(e){}}
function sec(id,title,body,cs){const c=!!SEC[id];
  return `<div class="card${c?' cl':''}" id="${id}"><button class="cardh" data-sec="${id}" aria-expanded="${!c}" aria-controls="${id}-b"><h2>${title}</h2><span class="chev" aria-hidden="true">${c?'▸':'▾'}</span></button>${c?(cs?`<div class="sub cs">${cs}</div>`:''):`<div class="sb" id="${id}-b">${body}</div>`}</div>`}
let D=null,sortBy='ph',period='all',q='',openSet=new Set(),lastLoad=0,onlyAct=true,hrsN=7,hrsDay='';

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pct(a,b){return b?Math.round(100*a/b):null}
function ago(t){if(!t)return '—';const m=Math.round((Date.now()-t)/60000);
  if(m<1)return 'τώρα';if(m<60)return 'πριν '+m+'΄';const h=Math.round(m/60);if(h<24)return 'πριν '+h+(h===1?' ώρα':' ώρες');
  const d=Math.round(h/24);if(d===1)return 'χθες';if(d<14)return 'πριν '+d+' μέρες';
  const x=new Date(t);return x.getDate()+'/'+(x.getMonth()+1)}
function f1(x){return x==null?'—':(Math.round(x*10)/10).toString().replace('.',',')}
const WEEK=7*864e5;

function load(manual){
  const b=document.getElementById('rf');if(b)b.classList.add('spin');
  BACKEND(KEY).then(j=>{D=typeof j==='string'?JSON.parse(j):j;lastLoad=Date.now();render()})
    .catch(e=>{document.getElementById('app').innerHTML='<div class="err">Δεν φόρτωσαν τα στοιχεία. Δοκίμασε ξανά σε λίγο.</div>'});
}

const cls=()=>D.players.filter(p=>!p.test);            // ο λογαριασμός του καθηγητή δεν μετρά πουθενά
function nowStrip(){
  const S=D.sun, sunT=S&&S.today&&S.has?`<button class="kpi go sunkpi" data-go="suncard"><div class="l">✦ Κυνηγοί φωτονίων σήμερα<span class="arr">→</span></div><div class="v gold">${S.ok}</div><div class="s">έλυσαν σωστά την πρόκληση · από <b>${S.n}</b> που την έπαιξαν${S.n?` (${Math.round(S.ok/S.n*100)}%)`:''}</div></button>`:'';
  const live=D.online==null?'':`<div class="kpi live"><div class="l"><span class="dot"></span>Παίζουν τώρα</div><div class="v" id="onl">${D.online}</div><div class="s">κίνηση στα τελευταία 3 λεπτά · μέγιστο σήμερα: <b id="onlpk">${D.peak}</b></div></div>`;
  return live||sunT?`<div class="kpis now">${live}${sunT}</div>`:'';
}
function kpis(){
  const P=cls(),now=D.now;
  const played=P.filter(p=>p.rounds>0), act=P.filter(p=>p.last&&now-p.last<=WEEK), nw=P.filter(p=>p.reg&&now-p.reg<=WEEK);
  const A3=P.filter(p=>p.rounds>=3), ret=P.filter(p=>p.dd>=2), retA=A3.filter(p=>p.dd>=2);
  const r7=D.days.slice(-7).reduce((s,d)=>s+d.r,0),rt=D.days[D.days.length-1].r;
  const ph=P.reduce((s,p)=>s+p.ph,0), n=P.reduce((s,p)=>s+p.n,0),ok=P.reduce((s,p)=>s+p.ok,0);
  const tiles=[
    ['Εγγεγραμμένοι μαθητές',P.length,'',`<b>+${nw.length}</b> νέοι την εβδομάδα`,'stucard'],
    ['Ενεργοί μαθητές (3+ γύροι)',A3.length,'',`${P.length?pct(A3.length,P.length):0}% των εγγεγραμμένων`,'stucard'],
    ['Επιστρέφουν',ret.length,'',`έπαιξαν σε 2+ μέρες · <b>${retA.length}</b> από τους ${A3.length} ενεργούς${A3.length?` (${pct(retA.length,A3.length)}%)`:''}`],
    ['Έπαιξαν τις 7 μέρες',act.length,'',`από ${played.length} που έχουν παίξει`],
    ['Γύροι τις 7 μέρες',r7,'',`<b>${rt}</b> σήμερα`],
    ['Φωτόνια τάξης',ph,'gold',`${P.filter(p=>p.ph>=10).length} μαθητές από Σπίθα και πάνω`],
    ['Σωστές απαντήσεις',n?pct(ok,n)+'%':'—','',`${ok} από ${n} · ${D.qActive} ενεργές ερωτήσεις`],
    ['Ενστάσεις',D.objOpen,D.objOpen?'gold':'',D.objOpen?'περιμένουν έλεγχο':`όλες ελεγμένες (${D.objTotal})`,'objcard']];
  const body=`<div class="kpis">${tiles.map(t=>t[4]?`<button class="kpi go" data-go="${t[4]}"><div class="l">${t[0]}<span class="arr">→</span></div><div class="v ${t[2]}">${t[1]}</div><div class="s">${t[3]}</div></button>`:`<div class="kpi"><div class="l">${t[0]}</div><div class="v ${t[2]}">${t[1]}</div><div class="s">${t[3]}</div></div>`).join('')}</div>`;
  return sec('sumcard','Σύνοψη',body,`${P.length} εγγεγραμμένοι · ${A3.length} ενεργοί · ${ret.length} επιστρέφουν`);
}

function activity(){
  const mx=Math.max(1,...D.days.map(d=>d.r));
  const W=['Κυ','Δε','Τρ','Τε','Πε','Πα','Σα'];
  const bars=D.days.map((d,i)=>{const h=Math.round(100*d.r/mx);const dt=new Date(d.d+'T12:00:00');
    const lab=d.d.slice(8)+'/'+String(+d.d.slice(5,7));
    return `<div class="c" data-tip="${W[dt.getDay()]} ${lab}: ${d.r} ${d.r===1?'γύρος':'γύροι'} · ${d.p} ${d.p===1?'μαθητής':'μαθητές'}">${d.r?`<span class="n" style="bottom:${h}%">${d.r}</span>`:''}<div class="b ${d.r?'':'z'}" style="height:${h}%"></div></div>`}).join('');
  const ax=D.days.map((d,i)=>{const dt=new Date(d.d+'T12:00:00');return `<span>${i%2===1||D.days.length-1===i?(i===D.days.length-1?'σήμ.':W[dt.getDay()]):''}</span>`}).join('');
  return sec('daycard','Δραστηριότητα ανά μέρα',`<div class="sub">Γύροι ανά μέρα, τελευταίες 14 μέρες</div><div class="act">${bars}</div><div class="axis">${ax}</div>`);
}

function chapters(){
  const rows=CHS.map(c=>{const g=D.chapters.find(x=>x.ch===c)||{n:0,ok:0};return {c,n:g.n,p:g.n?g.ok/g.n:null}})
    .sort((a,b)=>(a.p==null)-(b.p==null)||a.p-b.p);
  return sec('chcard','Ανά κεφάλαιο',`<div class="sub">% σωστές απαντήσεις της τάξης · το πιο δύσκολο πρώτο</div>${rows.map(r=>
    `<div class="hb ${r.p==null?'none':''}" data-tip="${esc(r.c)}: ${r.n} απαντήσεις${r.p==null?'':' · '+Math.round(r.p*100)+'% σωστές'}"><div class="nm">${esc(r.c)}</div><div class="trk"><i style="width:${r.p==null?0:Math.round(r.p*100)}%"></i></div><div class="pc">${r.p==null?'—':Math.round(r.p*100)+'%'}<small>${r.n}</small></div></div>`).join('')}`);
}

function spark(a){
  if(!a||a.length<2)return '';
  const w=260,h=54,mx=25,st=w/(a.length-1);
  const pts=a.map((v,i)=>[i*st,h-4-(h-10)*v/mx]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const y20=(h-4-(h-10)*20/mx).toFixed(1);
  return `<div class="spk"><div class="sl">Σκορ των τελευταίων ${a.length} γύρων (γραμμή: 20/25)</div><svg viewBox="-6 -2 ${w+12} ${h+4}" width="100%" style="display:block;max-width:420px"><line x1="0" x2="${w}" y1="${y20}" y2="${y20}" stroke="#2E4566" stroke-dasharray="4 4" stroke-width="1"/><path d="${d}" fill="none" stroke="#F5B841" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${a[i]>=25?'#F5B841':'#16263D'}" stroke="#F5B841" stroke-width="1.5" vector-effect="non-scaling-stroke"><title>${a[i]}/25</title></circle>`).join('')}</svg></div>`;
}

function player(p,i,v){
  v=v||pv(p);
  const ok=pct(v.ok,v.n),isNew=p.reg&&D.now-p.reg<=WEEK;
  const chs=CHS.filter(c=>p.ch[c]).map(c=>({c,n:p.ch[c][0],p:p.ch[c][1]/p.ch[c][0]}));
  const weak=chs.filter(x=>x.n>=5).sort((a,b)=>a.p-b.p)[0];
  const det=`<div class="det"><div>${period==='all'?'':'<div class="meta" style="margin-bottom:6px">Οι λεπτομέρειες από κάτω είναι συνολικές, από την εγγραφή του.</div>'}
      <div class="mini"><div><span>Γύροι</span><b>${p.rounds}</b></div><div><span>Μέσο /25</span><b>${f1(p.avg)}</b></div><div><span>Καλύτερο</span><b>${p.best??'—'}</b></div>
      <div><span>Σωστές ΠΕ</span><b>${p.mn?pct(p.mok,p.mn)+'%':'—'}</b></div><div><span>Σωστές Σ/Λ</span><b>${p.tn?pct(p.tok,p.tn)+'%':'—'}</b></div><div><span>Ρεβάνς</span><b>${p.rn?pct(p.rok,p.rn)+'%':'—'}</b></div></div>
      ${spark(p.spark)}
      <div class="weak">${weak?`Πιο αδύναμο: <b>${esc(weak.c)}</b> (${Math.round(weak.p*100)}% σωστές σε ${weak.n})`:''}${p.obj?` · ${p.obj} ${p.obj===1?'ένσταση':'ενστάσεις'}`:''}</div>
      <div class="meta" style="margin-top:6px">Εγγραφή: ${p.reg?new Date(p.reg).toLocaleDateString('el-GR'):'—'} · ${p.wk} γύροι την εβδομάδα</div>
    </div><div>${chs.length?chs.map(x=>`<div class="hb" data-tip="${esc(x.c)}: ${Math.round(x.p*100)}% σωστές σε ${x.n}"><div class="nm">${esc(x.c)}</div><div class="trk"><i style="width:${Math.round(x.p*100)}%"></i></div><div class="pc">${Math.round(x.p*100)}%<small>${x.n}</small></div></div>`).join(''):'<div class="empty">Δεν έχει απαντήσεις ακόμα.</div>'}</div></div>`;
  return `<div class="p ${openSet.has(p.nick)?'open':''}" data-n="${esc(p.nick)}"><button aria-expanded="${openSet.has(p.nick)}">
    <div class="rk ${!p.test&&i<3&&sortBy==='ph'&&v.ph>0?'g':''}">${p.test?'–':i+1}</div><div class="hero">${tierHero(p.ph)}</div>
    <div class="info"><div class="nk"><span class="nm2">${esc(p.nick)}${p.star?' <i class="pstar" title="Κυνηγός φωτονίων αυτή την εβδομάδα">✦</i>':''}</span>${p.test?'<span class="new tst">ΔΟΚΙΜΗ · δεν μετρά</span>':isNew?'<span class="new">ΝΕΟΣ</span>':''}</div><div class="meta"><span class="tier">${p.tier}</span> · ${ago(p.seen)}</div></div>
    <div class="nums"><div><b class="gold">${period==='all'?v.ph:'+'+v.ph}</b><span>φωτόνια</span></div><div><b>${v.rounds}</b><span>γύροι</span></div><div><b>${f1(v.avg)}</b><span>μέσο /25</span></div><div><b>${ok==null?'—':ok+'%'}</b><span>σωστές</span></div></div>
  </button>${det}</div>`;
}

/* Στοιχεία μαθητή για την περίοδο που έχει επιλεγεί: σήμερα (d), 7 μέρες (w) ή συνολικά */
function pv(p){
  if(period==='all')return {ph:p.ph,rounds:p.rounds,avg:p.avg,n:p.n,ok:p.ok,best:p.best};
  const g=p[period]||{r:0,sum:0,best:0,ph:0,n:0,ok:0};
  return {ph:g.ph,rounds:g.r,avg:g.r?g.sum/g.r:null,n:g.n,ok:g.ok,best:g.r?g.best:null};
}
function players(){
  const S={ph:(a,b)=>b.v.ph-a.v.ph||b.v.rounds-a.v.rounds,rounds:(a,b)=>b.v.rounds-a.v.rounds||b.v.n-a.v.n,avg:(a,b)=>(b.v.avg??-1)-(a.v.avg??-1),
    ok:(a,b)=>(b.v.n?b.v.ok/b.v.n:-1)-(a.v.n?a.v.ok/a.v.n:-1),seen:(a,b)=>b.p.seen-a.p.seen};
  let L=D.players.map(p=>({p,v:pv(p)}));
  if(period!=='all')L=L.filter(x=>x.v.rounds>0||x.v.n>0);
  const cnt=L.filter(x=>!x.p.test).length,rds=L.reduce((s,x)=>s+(x.p.test?0:x.v.rounds),0);
  const hidStar=onlyAct?L.filter(x=>!x.p.test&&x.p.rounds<3&&x.p.star).length:0;
  if(onlyAct)L=L.filter(x=>x.p.test||x.p.rounds>=3);                 // «Μόνο ενεργοί»: 3+ γύροι συνολικά
  if(q)L=L.filter(x=>x.p.nick.toLowerCase().includes(q.toLowerCase()));
  const shown=L.filter(x=>!x.p.test).length;
  L.sort(S[sortBy]);
  L=L.filter(x=>!x.p.test).concat(L.filter(x=>x.p.test));   // ο δοκιμαστικός παίκτης τελευταίος, χωρίς θέση
  const B=[['ph','Φωτόνια'],['rounds','Γύροι'],['avg','Μέσο σκορ'],['ok','% σωστές'],['seen','Πρόσφατοι']];
  const T=[['d','Σήμερα'],['w','7 μέρες'],['all','Όλα']];
  const when=period==='d'?'Σήμερα':'Τις τελευταίες 7 μέρες';
  const sub=period==='all'?'Πάτα έναν μαθητή για λεπτομέρειες. Το ✦ δείχνει όσους έλυσαν σωστά την πρόκληση της Κυριακής.':`${when} έπαιξαν <b>${cnt}</b> ${cnt===1?'μαθητής':'μαθητές'} · <b>${rds}</b> ${rds===1?'ολοκληρωμένος γύρος':'ολοκληρωμένοι γύροι'}`;
  const none=onlyAct&&cnt?'Κανένας ενεργός μαθητής (3+ γύροι) εδώ. Κλείσε το φίλτρο για να δεις όλους.':period==='d'?'Κανένας δεν έχει παίξει σήμερα ακόμα.':period==='w'?'Κανένας δεν έπαιξε τις τελευταίες 7 μέρες.':'Κανένας μαθητής ακόμα.';
  const body=`<div class="sub">${sub}</div>
    <div class="ctl"><div class="seg per"><span class="sl2">Περίοδος</span>${T.map(b=>`<button data-t="${b[0]}" class="${period===b[0]?'on':''}">${b[1]}</button>`).join('')}</div>
    <div class="seg srt"><span class="sl2">Ταξινόμηση</span>${B.map(b=>`<button data-s="${b[0]}" class="${sortBy===b[0]?'on':''}">${b[1]}</button>`).join('')}</div>
    <button class="tg ${onlyAct?'on':''}" id="actg" aria-pressed="${onlyAct}">${onlyAct?'✓ ':''}Μόνο ενεργοί (3+ γύροι)</button>
    <input class="srch" id="q" placeholder="Αναζήτηση ψευδωνύμου" value="${esc(q)}"></div>
    <div class="meta" style="margin:-4px 0 10px;white-space:normal">Εμφανίζονται <b>${shown}</b> από <b>${cnt}</b> μαθητές${hidStar?` · ${hidStar} με ✦ κρύβονται (λιγότεροι από 3 γύροι)`:''}</div>
    <div class="pl">${L.length?L.map((x,i)=>player(x.p,i,x.v)).join(''):`<div class="empty">${q?'Δεν βρέθηκε μαθητής.':none}</div>`}</div>
    ${L.length>8?'<button class="cardh foot" data-secx="stucard">Κλείσιμο λίστας μαθητών ▴</button>':''}`;
  return sec('stucard','Μαθητές',body,`${cls().length} μαθητές · πάτα τον τίτλο για να ανοίξει`);
}

function newbies(){
  const N=D.players.filter(p=>!p.test&&p.reg&&D.now-p.reg<=WEEK).sort((a,b)=>b.reg-a.reg);
  return sec('newcard','Νέοι αυτή την εβδομάδα',`<div class="sub">${N.length} ${N.length===1?'νέος μαθητής':'νέοι μαθητές'}</div>
    ${N.length?`<div class="newl">${N.map(p=>`<span>${esc(p.nick)} <small>${ago(p.reg)}</small></span>`).join('')}</div>`:'<div class="empty">Κανένας νέος τις τελευταίες 7 μέρες.</div>'}`,`${N.length} ${N.length===1?'νέος':'νέοι'} τις 7 μέρες`);
}
function hard(){

}
function objs(){
  return sec('objcard','Ενστάσεις',`<div class="sub">${CAN?'Πρώτα οι ανοιχτές. Διόρθωσε την ερώτηση ή σημείωσε ότι την έλεγξες.':'Οι πιο πρόσφατες · ελέγχονται στο φύλλο «Ενστάσεις»'}</div>
    ${D.objs.length?D.objs.map(o=>`<div class="ob"><div class="h"><b>${esc(o.nick)}</b><span>${ago(o.t)}</span><span>${esc(o.qid)}</span><span class="pill ${o.done?'d':'o'}">${o.done?'ελέγχθηκε':'ανοιχτή'}</span></div><div class="w">${esc(o.why)}</div>${o.txt?`<div class="x">«${esc(o.txt)}»</div>`:''}${o.q?`<div class="x">${esc(o.q)}</div>`:''}${o.mine||o.right?`<div class="x">Απάντησε: <b>${esc(o.mine||'—')}</b> · Το quiz θεωρεί σωστό: <b>${esc(o.right||'—')}</b></div>`:''}${o.done&&o.note?`<div class="x">Σημείωση: ${esc(o.note)}</div>`:''}${CAN?`<div class="acts"><button class="ab" data-edit="${esc(o.qid)}">Διόρθωση ερώτησης</button>${o.done?'':`<button class="ab t" data-res="${o.row}" data-qid="${esc(o.qid)}">Το έλεγξα</button>`}</div>`:''}</div>`).join(''):'<div class="empty">Καμία ένσταση ακόμα.</div>'}`,D.objOpen?`${D.objOpen} ανοιχτές`:`όλες ελεγμένες (${D.objTotal})`);
}

function sunday(){
  const s=D.sun; if(!s)return '';
  const dm=d=>{const p=String(d||'').split('-');return p.length===3?(+p[2])+'/'+(+p[1]):''};
  const pc=s.n?Math.round(s.ok/s.n*100):null, L=['α','β','γ','δ'];
  // για ποια Κυριακή διαλέγει: σήμερα, αν είναι Κυριακή χωρίς πρόκληση και χωρίς απαντήσεις· αλλιώς την επόμενη
  const tgt=chTarget(), isT=tgt===s.date, tgtHas=isT?s.has:s.next.has, tgtMix=isT?s.mix:s.next.mix, tgtCur=isT?s.cur:s.next.cur;
  const tgtTxt=tgt===s.date?'σήμερα':'την Κυριακή '+dm(tgt);
  const now=s.has
    ?`<div class="sunk"><div><b>${s.n}</b><span>απάντησαν</span></div><div><b class="gold">${s.ok}</b><span>σωστά</span></div><div><b>${pc==null?'–':pc+'%'}</b><span>επιτυχία</span></div></div>
      <div class="meta" style="margin-top:8px">«${mf(s.q)}»</div>`
    :`<div class="empty">${s.today?'Σήμερα είναι Κυριακή αλλά δεν έχει οριστεί πρόκληση, οπότε οι μαθητές δεν βλέπουν τίποτα.':`Για την Κυριακή ${dm(s.date)} δεν είχε οριστεί πρόκληση.`}</div>`;
  const wk=(s.week||[]).map(w=>{
    const ri=L.indexOf(w.right);
    const bars=w.d.map((c,i)=>{const p=w.n?Math.round(c/w.n*100):0;return `<div class="wb ${i===ri?'r':''}"><span class="wl">${L[i]}${i===ri?' ✓':''}</span><span class="wt"><i style="width:${p}%"></i></span><span class="wp">${p}%</span></div>`}).join('');
    return `<div class="wq"><div class="wh"><b class="werr">${Math.round(w.err*100)}% λάθος</b><span class="meta">${esc(w.id)} · ${esc(w.ch)} · ${w.n} απαντήσεις</span></div>
      <div class="wtx">${mf(w.txt)}</div><div class="wbars">${bars}</div>
      <div class="acts"><button class="ab" data-setch="${esc(w.id)}">Πρόκληση για ${esc(tgtTxt)}</button><button class="ab t" data-edit="${esc(w.id)}">Προβολή / διόρθωση</button></div></div>`}).join('');
  const winners=s.today&&s.has&&s.win?`<div class="winl"><div class="meta" style="margin-bottom:6px">${s.win.length?`Την έλυσαν σωστά (${s.win.length}):`:'Κανείς δεν την έχει λύσει σωστά ακόμα.'}</div>${s.win.map(n=>`<span class="winc">${esc(n)} <i>✦</i></span>`).join('')}</div>`:'';
  return sec('suncard','Πρόκληση της Κυριακής',`<div class="sub">${s.today?'Σήμερα':'Κυριακή'} ${dm(s.date)}${s.has&&!s.today?' · το σήμα ✦ ισχύει ως το Σάββατο':''}</div>
    ${now}${winners}
    <div class="sunnext"><div class="meta">Πρόκληση για ${esc(tgtTxt)}: ${tgtHas?`<b style="color:var(--grnb)">έχει οριστεί ✓</b>${tgtMix===false?' <span class="nomix">χωρίς ανακάτεμα</span>':''}`:'<b style="color:var(--ban)">δεν έχει οριστεί ακόμα</b>'}</div>
      ${tgtHas&&tgtCur?`<div class="chprev"><div class="wtx" style="color:var(--txt);font-weight:700">${mf(tgtCur.q)}</div>
        ${tgtCur.o.map((t,i)=>`<div class="cpo ${i===tgtCur.a?'r':''}"><b>${L[i]}</b><span>${mf(t)}</span>${i===tgtCur.a?'<em>σωστή</em>':''}</div>`).join('')}
        <div class="meta" style="margin-top:6px">Με τη σειρά του φύλλου, όπως στο story σου. Στους μαθητές η σωστή εμφανίζεται σε άλλο γράμμα.${isT&&!s.n?' Μπορείς να την αλλάξεις μέχρι να απαντήσει ο πρώτος μαθητής.':''}</div></div>`:''}
      <div class="meta" style="margin-top:6px">Οι επιλογές ανακατεύονται για κάθε μαθητή και η σωστή αλλάζει πάντα γράμμα σε σχέση με το story. Το quiz κρατά τη σωστή και τη βαθμολογεί μόνο του.</div></div>
    ${CAN?`<h3 class="h3">Οι πιο δύσκολες της εβδομάδας</h3><div class="meta" style="margin-bottom:8px">Πολλαπλής επιλογής, με τουλάχιστον 5 απαντήσεις τις τελευταίες 7 μέρες. Οι μπάρες δείχνουν τι απάντησαν οι μαθητές (με τη σειρά του φύλλου, όπως στο story).</div>
      ${wk||'<div class="empty">Δεν υπάρχουν ακόμα αρκετές απαντήσεις αυτή την εβδομάδα.</div>'}
      <div class="idrow" style="margin-top:12px"><input class="srch" id="chid" autocomplete="off" autocapitalize="off" placeholder="ή γράψε id ερώτησης"><button class="rf" id="chgo">Ορισμός</button></div>
      <div class="msg2" id="chmsg"></div>
      <div class="acts"><a class="ab t" href="./?dokimi=1" target="_blank" rel="noopener" style="text-decoration:none">Δοκιμή Κυριακής (χωρίς καταγραφή)</a></div>`:''}`,s.has?`${s.today?'Σήμερα':dm(s.date)}: ${s.ok} σωστά από ${s.n}`:'');
}

/* ---------- Δραστηριότητα ανά ώρα (ώρα Ελλάδας, διαφορετικοί μαθητές) ---------- */
const DN=['Δε','Τρ','Τε','Πε','Πα','Σα','Κυ'], DNL=['Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο','Κυριακή'];
const addD=(s,n)=>{const p=s.split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n)).toISOString().slice(0,10)};
const rowOf=s=>{const p=s.split('-');return (new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay()+6)%7};   // 0 = Δευτέρα
const dmy=s=>{const p=String(s).split('-');return (+p[2])+'/'+(+p[1])};
const hh=h=>String(h).padStart(2,'0')+':00';
const n1=x=>Number.isInteger(x)?String(x):(Math.round(x*10)/10).toString().replace('.',',');
function hours(){
  if(!D.hours)return '';
  const H=D.hours, spec={}; (D.special||[]).forEach(x=>spec[x.d]=x.note);
  const dates=[]; for(let i=hrsN-1;i>=0;i--)dates.push(addD(D.tdy,-i));
  const sum=DN.map(()=>Array(24).fill(0)), occ=Array(7).fill(0), exc=[];
  dates.forEach(d=>{if(d in spec){exc.push(d);return}const r=rowOf(d);occ[r]++;(H[d]||[]).forEach((v,h)=>sum[r][h]+=v)});
  const avg=sum.map((row,r)=>row.map(v=>occ[r]?v/occ[r]:0));
  const mx=Math.max(0,...avg.flat()), many=hrsN>7;
  const cell=(v,r,h)=>`<div class="c${v?'':' z'}" style="${v?`background:rgba(63,193,201,${(0.15+0.85*v/mx).toFixed(2)})`:''}" data-tip="${DNL[r]} ${hh(h)}–${hh((h+1)%24)} · ${n1(v)} ${v===1?'μαθητής':'μαθητές'}${many?' (μέσος όρος)':''}"></div>`;
  const grid=`<div class="hm" role="img" aria-label="Θερμικός χάρτης: μαθητές ανά μέρα και ώρα">${DN.map((n,r)=>`<div class="rl">${n}</div>${avg[r].map((v,h)=>cell(v,r,h)).join('')}`).join('')}
    <div></div>${Array.from({length:24},(_,h)=>`<div class="hl">${h%3===0?String(h).padStart(2,'0'):''}</div>`).join('')}</div>`;
  function top(rows){const v=Array.from({length:24},(_,h)=>{let s=0,o=0;rows.forEach(r=>{s+=sum[r][h];o+=occ[r]});return {h,v:o?s/o:0}});
    const t=v.filter(x=>x.v>0).sort((a,b)=>b.v-a.v||a.h-b.h).slice(0,3);
    return t.length?`<ol>${t.map(x=>`<li><b>${hh(x.h)}–${hh((x.h+1)%24)}</b> <span>· ${n1(Math.round(x.v*10)/10)} ${x.v===1?'μαθητής':'μαθητές'}${many||rows.length>1?' κατά μέσο όρο':''}</span></li>`).join('')}</ol>`:'<div class="empty">Δεν υπάρχουν ακόμα στοιχεία.</div>'}
  const has=mx>0;
  // ραβδόγραμμα μίας μέρας
  const day=hrsDay||D.tdy, opts=[]; for(let i=0;i<60;i++){const d=addD(D.tdy,-i);opts.push(d)}
  const bars=H[day]||Array(24).fill(0), bm=Math.max(1,...bars), pk=bars.indexOf(Math.max(...bars));
  const dayN=(D.dayN||{})[day]||0;
  const chart=`<div class="act a24" role="img" aria-label="Μαθητές ανά ώρα στις ${dmy(day)}">${bars.map((v,h)=>{const p=Math.round(100*v/bm);return `<div class="c" data-tip="${hh(h)}–${hh((h+1)%24)} · ${v} ${v===1?'μαθητής':'μαθητές'}">${v&&h===pk?`<span class="n" style="bottom:${p}%">${v}</span>`:''}<div class="b ${v?'':'z'}" style="height:${p}%"></div></div>`}).join('')}</div>
    <div class="axis a24">${bars.map((_,h)=>`<span>${h%3===0?String(h).padStart(2,'0'):''}</span>`).join('')}</div>`;
  const spNow=day in spec
    ?`<div class="spn">Ειδική μέρα: «${esc(spec[day])}». Δεν μετρά στον θερμικό χάρτη.${CAN?` <button class="ab" id="spdel" style="margin-left:6px">Αφαίρεση</button>`:''}</div>`
    :(CAN?`<div class="sprow"><input class="srch" id="spnote" maxlength="80" placeholder="Σημείωση (π.χ. κοινοποίηση σε ομάδες καθηγητών)"><button class="ab" id="spadd">Ειδική μέρα</button></div>`:'');
  const spList=(D.special||[]).slice().sort((a,b)=>a.d<b.d?1:-1);
  const body=`<div class="sub">Διαφορετικοί μαθητές ανά ώρα, ώρα Ελλάδας${many?' · μέσος όρος ανά μέρα':''}</div>

function weekHard(){

    const why=w.t!=='mc'?'Σωστό/Λάθος: δεν μπαίνει ως πρόκληση.':w.img?'Έχει σχήμα: δεν μπαίνει ως πρόκληση.':'';

      <div class="wtx" style="color:var(--txt)">${mf(w.q)}</div>
      ${rows.map(x=>{const p=w.n?Math.round(100*x.c/w.n):0;return `<div class="wo ${x.r?'r':''}"><b>${x.l}</b><div>${x.t}${x.r?'<em>σωστή</em>':''}<div class="wt"><i style="width:${p}%"></i></div></div><span class="wn">${x.c} · ${p}%</span></div>`}).join('')}
      <div class="acts">${CAN?(mine?`<button class="ab" data-pick="">Αφαίρεση επιλογής</button>`:`<button class="ab sel" data-pick="${esc(w.id)}">${pk?'Αυτή αντί για την άλλη':'Αυτή είναι η πιο δύσκολη'}</button>`):''}${CAN&&s&&!why?`<button class="ab" data-setch="${esc(w.id)}" data-msg="whmsg">Πρόκληση για ${esc(tgtTxt)}</button>`:''}${CAN?`<button class="ab t" data-edit="${esc(w.id)}">Προβολή / διόρθωση</button>`:''}</div>
      ${why?`<div class="meta" style="margin-top:6px">${why}</div>`:''}</div>`};

// tooltip για στήλες και μπάρες
const tip=document.getElementById('tip');
function showTip(e){const t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}
  tip.textContent=t.dataset.tip;tip.style.display='block';const r=t.getBoundingClientRect();
  let x=r.left+r.width/2-tip.offsetWidth/2;x=Math.max(8,Math.min(x,innerWidth-tip.offsetWidth-8));
  tip.style.left=x+'px';tip.style.top=Math.max(8,r.top-tip.offsetHeight-8)+'px'}
document.addEventListener('pointerover',showTip);document.addEventListener('pointerdown',showTip);
document.addEventListener('scroll',()=>tip.style.display='none',{passive:true});
setInterval(()=>{const a=document.getElementById('ago');if(a&&lastLoad){const m=Math.round((Date.now()-lastLoad)/60000);a.textContent=m<1?'ενημερώθηκε τώρα':'ενημερώθηκε πριν '+m+'΄'}},20000);
setInterval(()=>{if(!document.hidden)load()},120000);
/* «Παίζουν τώρα»: ελαφριά ενημέρωση κάθε 20΄΄ (μόνο ο μετρητής, όχι όλος ο πίνακας) */
setInterval(()=>{if(document.hidden||!CAN||!D||!KEY)return;
  apiCall('dashLive',[KEY],1).then(x=>{D.online=x.online;D.peak=x.peak;const a=document.getElementById('onl'),b=document.getElementById('onlpk');if(a)a.textContent=x.online;if(b)b.textContent=x.peak}).catch(()=>{})},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastLoad>60000)load()});
/* Σύνδεση με το Apps Script (το Sheet του καθηγητή) μέσω απλού αιτήματος, χωρίς πλαίσιο της Google */
const API_URL='https://script.google.com/macros/s/AKfycbwoioQnP3Akcq6fvg0NuGGhjRryhF-g139khGRPJM-QkYMISVRggAGnQIqcJBrbmU-M6A/exec';
function apiCall(fn,args,tries,n){
  tries=tries==null?3:tries; n=n||0;
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow',credentials:'omit',cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json()})
    .then(j=>{if(!j.ok){const e=new Error(j.err||'error');e.server=j.err!=='error';throw e}return j.r})
    // αποτυχία δικτύου ή «πολλοί μαζί» στον server: ξαναδοκιμάζει μόνο του, με μικρή τυχαία αναμονή για να μη χτυπούν όλοι μαζί
    .catch(e=>{if(!e.server&&tries>1)return new Promise(r=>setTimeout(r,700+n*900+Math.random()*900)).then(()=>apiCall(fn,args,tries-1,n+1));throw e});
}

function getKey_(){let k='';try{if(location.hash.length>1){k=decodeURIComponent(location.hash.slice(1));localStorage.setItem('fotonio_dash_key',k);history.replaceState(null,'',location.pathname)}else k=localStorage.getItem('fotonio_dash_key')||''}catch(e){}return k}
KEY=getKey_();
function needKey(msg){
  document.getElementById('app').innerHTML=`<div class="card" style="max-width:420px;margin:40px auto;text-align:center">
    <div style="display:flex;justify-content:center;margin-bottom:10px">${LOGO.replace('<svg ','<svg style="width:56px;height:56px" ')}</div>
    <h2 style="margin-bottom:6px">Πίνακας καθηγητή</h2><div class="sub">${msg||'Γράψε τον κωδικό του πίνακα. Θα τον θυμάται αυτή η συσκευή.'}</div>
    <input class="srch" id="kin" type="password" autocomplete="off" placeholder="Κωδικός" style="width:100%;margin:6px 0 12px;text-align:center">
    <button class="rf" id="kgo" style="width:100%;padding:10px">Άνοιγμα</button></div>`;
  const go=()=>{KEY=document.getElementById('kin').value.trim();try{localStorage.setItem('fotonio_dash_key',KEY)}catch(e){}load()};
  document.getElementById('kgo').onclick=go;document.getElementById('kin').onkeydown=e=>{if(e.key==='Enter')go()};
}
function BACKEND(k){return apiCall('dash',[k]).catch(e=>{if(e.server&&/auth/.test(e.message)){try{localStorage.removeItem('fotonio_dash_key')}catch(_){}needKey('Λάθος κωδικός. Δοκίμασε ξανά.');return new Promise(()=>{})}throw e})}
window.addEventListener('hashchange',()=>{const k=getKey_();if(k){KEY=k;load()}});

if(KEY)load();else needKey();
</script>
