<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Φωτόνιο · Πίνακας καθηγητή</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
<style>
:root{
  --bg:#0F1B2D; --card:#16263D; --card2:#1B2E49; --bor:#2E4566; --ban:#F5B841; --teal:#3FC1C9;
  --txt:#EEF2F8; --soft:#C9D3E0; --mut:#9FB0C4; --dim:#7F93AD;
  --redb:#F0525F; --grnb:#2F8F72;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--f);font-size:15px;line-height:1.45}
body{padding:max(16px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--ban);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:44px;flex:0 0 44px}
.bt{font-weight:800;letter-spacing:.06em;line-height:1.05;font-size:20px}
.bt b{color:var(--ban)} .bt small{display:block;font-weight:600;letter-spacing:.02em;color:var(--mut);font-size:13px;margin-top:4px}
.upd{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.rf{border:1px solid var(--bor);border-radius:999px;padding:7px 14px;font-weight:600;color:var(--txt);background:var(--card)}
.rf.spin{opacity:.6}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grnb);box-shadow:0 0 0 3px rgba(47,143,114,.25)}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--card);border:1px solid var(--bor);border-radius:16px;padding:14px 14px 12px}
.kpi .l{color:var(--mut);font-size:12.5px;font-weight:600;letter-spacing:.02em}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v.gold{color:var(--ban)}
.kpi .s{color:var(--dim);font-size:12.5px;margin-top:2px}
.kpi .s b{color:var(--teal);font-weight:700}

.grid2{display:grid;gap:16px;align-items:start}
@media(min-width:900px){.grid2{grid-template-columns:1.25fr 1fr}}
.card{background:var(--card);border:1px solid var(--bor);border-radius:18px;padding:16px}
.card h2{font-size:16px;margin:0 0 2px;font-weight:800}
.card .sub{color:var(--mut);font-size:13px;margin-bottom:12px}

/* δραστηριότητα */
.act{position:relative;height:150px;display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--bor);padding-top:18px}
.act .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.act .b{width:100%;max-width:26px;background:var(--ban);border-radius:4px 4px 0 0;min-height:0}
.act .b.z{background:var(--bor);height:2px!important;border-radius:2px}
.act .n{position:absolute;font-size:11px;color:var(--soft);font-weight:600;transform:translateY(-16px)}
.axis{display:flex;gap:4px;margin-top:6px}
.axis span{flex:1;text-align:center;font-size:10.5px;color:var(--dim)}
.tip{position:fixed;z-index:20;pointer-events:none;background:#0B1424;border:1px solid var(--bor);border-radius:10px;padding:7px 10px;font-size:12.5px;color:var(--txt);box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;white-space:nowrap}

/* κεφάλαια */
.hb{display:grid;grid-template-columns:44% 1fr 44px;align-items:center;gap:10px;padding:6px 0}
.hb .nm{font-size:13.5px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk{height:10px;background:#0F1B2D;border-radius:5px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--teal);border-radius:0 4px 4px 0}
.hb .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px}
.hb .pc small{display:block;color:var(--dim);font-weight:500;font-size:11px}
.hb.none .nm,.hb.none .pc{color:var(--dim)}

/* παίκτες */
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.seg button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap;border:1px solid var(--bor);background:#0F1B2D}
.seg button.on{background:var(--ban);border-color:var(--ban);color:#1B1300}
.seg{align-items:center}.sl2{font-size:11.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;width:100%}
.seg.per button.on{background:var(--teal);border-color:var(--teal);color:#06202A}
.tg{border:1px solid var(--bor);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--mut)}
.tg.on{border-color:var(--teal);color:var(--teal)}
.srch{flex:1;min-width:140px;background:#0F1B2D;border:1px solid var(--bor);border-radius:999px;padding:7px 14px;color:var(--txt);font:inherit;font-size:13.5px}
.pl{display:flex;flex-direction:column;gap:8px}
.p{background:var(--card2);border:1px solid var(--bor);border-radius:14px}
.p>button{width:100%;text-align:left;display:grid;grid-template-columns:22px 44px 1fr;grid-template-areas:'rk hero info' 'rk hero nums';column-gap:10px;row-gap:6px;align-items:center;padding:10px 12px}
.p .rk{grid-area:rk}.p .hero{grid-area:hero}.p .info{grid-area:info}.p .nums{grid-area:nums;justify-content:flex-start}
.p .nums div{align-items:flex-start}
@media(min-width:640px){.p>button{grid-template-columns:28px 52px 1fr auto;grid-template-areas:'rk hero info nums';column-gap:14px;padding:10px 14px}.p .nums{justify-content:flex-end}.p .nums div{align-items:flex-end}}
.rk{color:var(--dim);font-weight:800;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.rk.g{color:var(--ban)}
.hero{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.hero svg{max-width:44px;max-height:44px}
.nk{font-weight:800;font-size:15.5px;display:flex;align-items:center;gap:6px}
.nk .nm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new{flex:0 0 auto}
.new.tst{background:none;border:1px solid var(--bor);color:var(--mut)}
.new{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#0B2427;background:var(--teal);border-radius:999px;padding:1px 7px}
.meta{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .tier{color:var(--ban);font-weight:700}
.nums{display:flex;gap:18px}
.nums div{display:flex;flex-direction:column;align-items:flex-end}
.nums b{font-size:16px;line-height:1.1;font-variant-numeric:tabular-nums}
.nums b.gold{color:var(--ban)}
.nums span{font-size:11px;color:var(--dim)}
.det{display:none;border-top:1px solid var(--bor);padding:12px 14px 14px;gap:14px}
.p.open .det{display:grid}
@media(min-width:760px){.p.open .det{grid-template-columns:1fr 1fr}}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{background:#0F1B2D;border-radius:10px;padding:8px 10px}
.mini span{display:block;font-size:11.5px;color:var(--mut)}
.mini b{font-size:16px;font-variant-numeric:tabular-nums}
.spk{margin-top:10px}
.spk .sl{font-size:12px;color:var(--mut);margin-bottom:4px}
.weak{margin-top:8px;font-size:13px;color:var(--soft)}
.weak b{color:var(--redb)}
.empty{color:var(--dim);font-size:13.5px;padding:8px 2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ab{border:1px solid var(--bor);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--ban);background:var(--bg)}
.ab.t{color:var(--teal)} .ab:disabled{opacity:.5}
.idrow{display:flex;gap:8px;margin-top:4px}
.ov{position:fixed;inset:0;background:rgba(6,12,22,.86);z-index:20;overflow:auto;padding:14px;display:flex;align-items:flex-start;justify-content:center}
.ed{background:var(--card);border:1px solid var(--bor);border-radius:18px;padding:16px;width:100%;max-width:640px;margin:auto}
.ed h2{margin:0 0 2px;font-size:18px} .ed .sub{color:var(--mut);font-size:12.5px;margin-bottom:10px}
.ed label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:12px 0 4px}
.ed textarea,.ed select{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--bor);border-radius:10px;padding:9px 11px;font:inherit;font-size:14.5px;line-height:1.4}
.ed textarea{resize:vertical;min-height:44px}
.ed .or{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;margin-bottom:6px}
.ed .or b{width:28px;height:28px;border-radius:50%;background:var(--teal);color:var(--bg);display:grid;place-items:center;font-size:13px;margin-top:7px}
.ed .or.r textarea{border-color:var(--grnb);box-shadow:0 0 0 1px var(--grnb)}
.ed .ck{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--soft)}
.ed .ck input{width:20px;height:20px;accent-color:var(--ban)}
.ed .bts{display:flex;gap:10px;margin-top:16px}
.ed .bts button{flex:1;border-radius:12px;padding:12px;font-weight:800}
.ed .sv{background:var(--ban);color:var(--bg)} .ed .cn{border:1px solid var(--bor)}
.ed .msg{min-height:1.4em;margin-top:10px;font-size:13.5px;color:var(--ban)}
.ed .hint{font-size:12px;color:var(--dim);margin-top:4px}

/* ερωτήσεις / ενστάσεις */
.q{padding:10px 0;border-bottom:1px solid var(--bor);display:grid;grid-template-columns:54px 1fr;gap:12px}
.q:last-child{border-bottom:0}
.q .e{font-size:18px;font-weight:800;color:var(--redb);font-variant-numeric:tabular-nums;text-align:right}
.q .e small{display:block;font-size:10.5px;color:var(--dim);font-weight:500}
.q .t{font-size:13.5px;color:var(--soft)}
.q .t .m{display:block;font-size:11.5px;color:var(--dim);margin-top:3px}
.off{font-size:10.5px;font-weight:700;color:var(--dim);border:1px solid var(--bor);border-radius:999px;padding:0 6px;margin-left:4px}
.ob{padding:10px 0;border-bottom:1px solid var(--bor);font-size:13.5px}
.ob:last-child{border-bottom:0}
.ob .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:12.5px}
.ob .h b{color:var(--txt)}
.pill{font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 8px}
.pill.o{background:rgba(245,184,65,.15);color:var(--ban);border:1px solid rgba(245,184,65,.5)}
.pill.d{color:var(--dim);border:1px solid var(--bor)}
.ob .w{color:var(--soft);margin-top:3px}
.ob .x{color:var(--dim);font-size:12.5px;margin-top:2px}
.newl{display:flex;flex-wrap:wrap;gap:6px}
.newl span{background:#0F1B2D;border:1px solid var(--bor);border-radius:999px;padding:4px 10px;font-size:13px}
.newl small{color:var(--dim)}
.err{background:#3A1A24;border:1px solid var(--redb);color:#FFD6DA;border-radius:14px;padding:14px}
.load{color:var(--mut);text-align:center;padding:40px 0}
</style>
<link rel="manifest" href="/manifest-pinakas.webmanifest">
<link rel="icon" href="/icon2-dash-192.png">
<link rel="apple-touch-icon" href="/icon2-dash-180.png">
<meta name="theme-color" content="#0F1B2D">
</head>
<body>
<div class="wrap" id="app"><div class="load">Φόρτωση…</div></div>
<div class="tip" id="tip"></div>
<script>
/* ---------- Το Φωτόνιο του παίκτη ανάλογα με τα φωτόνια (βαθμίδα ανά 10) ---------- */
function tierHero(n){
  const uid='u'+Math.random().toString(36).slice(2,7);
  /* Κάθε δεκάδα ξεκλειδώνει κάτι καινούριο που φαίνεται καθαρά:
     0 μισόκλειστα μάτια στο σκοτάδι · 10 ανοίγει τα μάτια, πρώτη σπίθα · 20 λαμπερό περίγραμμα, μάγουλα, χαιρετά
     30 ακτίνες φωτός · 40 οι ακτίνες γυρίζουν, φωτεινή ουρά · 50 σπίθες, φωτοστέφανο, σηκώνει τα χέρια
     60 φωτόνιο σε τροχιά · 70 πρώτη φλόγα · 80 χρυσές ακτίνες, μεγαλύτερη φλόγα · 90 διπλή αύρα · 100 πλήρης φλόγα «φως» */
  const t=Math.min(10,Math.floor(n/10));
  const T='#3FC1C9',A='#F5B841',N='#0F1B2D';
  const body=['#0B1320','#132541','#18304F','#1C3A5E','#21446D','#264E7C','#2A588A','#2E6297','#326CA4','#3776B0','#3C80BC'][t];
  const bright=[.5,.72,.84,.92,1,1,1,1,1,1,1][t];
  const glow=[0,3,7,10,13,16,18,20,22,24,26][t];
  let back='', crown='', front='';
  // ακτίνες φωτός πίσω από το σώμα
  if(t>=3){
    const L=t>=8?32:t>=5?28:t>=4?24:16, c=t>=8?'#FFD36B':A, cnt=t>=8?16:12;
    let r='';for(let i=0;i<cnt;i++){const a=i*360/cnt*Math.PI/180;r+=`<line x1="${(150+76*Math.sin(a)).toFixed(1)}" y1="${(115-76*Math.cos(a)).toFixed(1)}" x2="${(150+(76+L)*Math.sin(a)).toFixed(1)}" y2="${(115-(76+L)*Math.cos(a)).toFixed(1)}" stroke="${c}" stroke-width="${t>=8?5:4}" stroke-linecap="round" opacity="${t>=8?.85:.6}"/>`;}
    back+=`<g class="${t>=4?'spin':''}">${r}</g>`;
  }
  // φωτοστέφανο / αύρα
  if(t>=5) back+=`<circle class="halo" cx="150" cy="115" r="${t>=9?84:78}" fill="none" stroke="${A}" stroke-width="3" opacity=".7" stroke-dasharray="${t>=9?'':'6 8'}"/>`;
  if(t>=9) back+=`<circle class="halo" cx="150" cy="115" r="96" fill="none" stroke="${T}" stroke-width="2.5" opacity=".6" style="animation-delay:-1.2s"/>`;
  // πρώτη σπίθα (10–49)
  if(t>=1&&t<5) front+=`<path class="twinkle" d="M206 52 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#FFF3D1"/>`;
  // σπίθες που ανεβαίνουν (50+)
  if(t>=5){
    const ns=t>=7?5:t>=6?4:3;
    const sp=[[-26,40,'#FFF3D1',3.4,-.2],[22,44,A,3.2,-1.0],[-6,34,T,3,-.6],[34,52,'#FFF3D1',2.8,-1.4],[-38,54,A,3,-.9]];
    for(let i=0;i<ns;i++){const [dx,y,c,r,d]=sp[i];front+=`<circle class="spark" cx="${150+dx}" cy="${y}" r="${r}" fill="${c}" style="animation-delay:${d}s"/>`;}
  }
  // φωτόνια σε τροχιά (60+)
  if(t>=6){const no=t>=10?3:t>=7?2:1;for(let i=0;i<no;i++)front+=`<g class="orbit" style="animation-delay:${-i*1.3}s"><circle cx="150" cy="${115-90}" r="6" fill="${i%2?T:A}"/><circle cx="150" cy="${115-90}" r="11" fill="${i%2?T:A}" opacity=".25"/></g>`;}
  // φλόγα (70+)
  if(n>=70){
    /* μία ενιαία φλόγα σαν το 🔥: κεντρική ψηλή γλώσσα με δύο μικρότερες στα πλάγια, στρώσεις χρώματος από μέσα προς τα έξω */
    const k2=n>=100?Math.min(1.15,1+(n-100)/400):n>=90?.88:n>=80?.76:.62;
    const H=96*k2+22, W=90*Math.min(1.05,.68+k2*.32);
    const P=(x,y)=>`${(x*W).toFixed(1)} ${(-y*H).toFixed(1)}`;
    const outer=`M${P(0,0)} C${P(-.62,0)} ${P(-.78,.36)} ${P(-.56,.62)} C${P(-.5,.5)} ${P(-.42,.46)} ${P(-.36,.5)} C${P(-.36,.66)} ${P(-.2,.82)} ${P(.02,1)} C${P(0,.86)} ${P(.12,.78)} ${P(.22,.74)} C${P(.24,.66)} ${P(.3,.62)} ${P(.44,.64)} C${P(.4,.58)} ${P(.7,.4)} ${P(.62,.22)} C${P(.56,.06)} ${P(.32,0)} ${P(0,0)}Z`;
    const drop=(sx,sy)=>`M${P(0,0)} C${P(-.5*sx,0)} ${P(-.55*sx,.4*sy)} ${P(-.08*sx,.98*sy)} C${P(-.04*sx,.7*sy)} ${P(.18*sx,.62*sy)} ${P(.3*sx,.48*sy)} C${P(.5*sx,.3*sy)} ${P(.42*sx,0)} ${P(0,0)}Z`;
    crown+=`<defs><linearGradient id="fo${uid}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F05A1A"/><stop offset=".6" stop-color="#F28A1E"/><stop offset="1" stop-color="${A}"/></linearGradient>
      <filter id="glo${uid}" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter></defs>
    <g transform="translate(150 96)">
      <path d="${outer}" fill="${A}" opacity=".35" filter="url(#glo${uid})"/>
      <g class="flame">
        <path d="${outer}" fill="url(#fo${uid})"/>
        <g transform="translate(0 ${(-H*.2).toFixed(1)})"><path class="fl b" d="${drop(.72,.62)}" fill="${A}"/>
        <path class="fl c" d="${drop(.42,.36)}" fill="#FFE9A6"/></g>
      </g>
    </g>`;
    }
  // στάση σώματος και πρόσωπο
  const sleepy=t===0;
  const armR=t>=5?`<path d="M206 106 Q228 88 222 62" fill="none" stroke="${T}" stroke-width="7" stroke-linecap="round"/><circle cx="222" cy="58" r="7" fill="${T}"/>`
           :t>=2?`<path d="M208 114 L236 100" fill="none" stroke="${T}" stroke-width="7" stroke-linecap="round"/><circle cx="238" cy="99" r="6.5" fill="${T}"/>`
           :`<path d="M198 152 Q192 172 172 160" fill="none" stroke="${T}" stroke-width="7" stroke-linecap="round"/><circle cx="168" cy="157" r="6.5" fill="${T}"/>`;
  const armL=t>=5?`<path d="M92 128 Q70 112 76 86" fill="none" stroke="${T}" stroke-width="7" stroke-linecap="round"/><circle cx="76" cy="82" r="7" fill="${T}"/>`
           :`<path d="M92 128 Q80 142 86 156" fill="none" stroke="${T}" stroke-width="7" stroke-linecap="round"/>`;
  const eyes=sleepy
    ?`<ellipse cx="132" cy="102" rx="12" ry="7" fill="#fff" opacity=".8"/><ellipse cx="168" cy="102" rx="12" ry="7" fill="#fff" opacity=".8"/><circle cx="133" cy="104" r="4" fill="${N}"/><circle cx="169" cy="104" r="4" fill="${N}"/><path d="M119 99 Q132 93 145 99 M155 99 Q168 93 181 99" stroke="${body}" stroke-width="5" fill="none"/>`
    :`<ellipse cx="132" cy="100" rx="12" ry="14" fill="#fff"/><ellipse cx="168" cy="100" rx="12" ry="14" fill="#fff"/><circle cx="134" cy="100" r="6" fill="${N}"/><circle cx="170" cy="100" r="6" fill="${N}"/><circle cx="137" cy="96" r="2" fill="#fff"/><circle cx="173" cy="96" r="2" fill="#fff"/>`;
  const mouth=t===0?`<path d="M142 130 Q150 128 158 130" fill="none" stroke="${A}" stroke-width="4" stroke-linecap="round" opacity=".8"/>`
            :t<2?`<path d="M140 126 Q150 136 160 126" fill="none" stroke="${A}" stroke-width="5" stroke-linecap="round"/>`
            :`<path d="M134 122 Q150 146 166 122 Z" fill="${A}"/>`;
  const cheeks=t>=2?`<circle cx="118" cy="122" r="7" fill="${A}" opacity=".35"/><circle cx="182" cy="122" r="7" fill="${A}" opacity=".35"/>`:'';
  const tail=t>=4?A:'#C9973A', tw=t>=4?6:4.5;
  const ring=t>=2?`drop-shadow(0 0 ${t>=6?8:5}px ${T})`:'';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 ${t>=7?-40:t>=3?-12:12} 270 ${t>=7?278:t>=3?250:212}" role="img" aria-label="Το Φωτόνιο με ${n} φωτόνια">
  <g class="float" style="filter:brightness(${bright}) drop-shadow(0 0 ${glow}px rgba(245,184,65,${(0.1+0.06*t).toFixed(2)}))">
  ${back}
  ${crown}

function ago(t){if(!t)return '—';const m=Math.round((Date.now()-t)/60000);
  if(m<1)return 'τώρα';if(m<60)return 'πριν '+m+'΄';const h=Math.round(m/60);if(h<24)return 'πριν '+h+(h===1?' ώρα':' ώρες');
  const d=Math.round(h/24);if(d===1)return 'χθες';if(d<14)return 'πριν '+d+' μέρες';

function kpis(){
  const P=D.players.filter(p=>!p.test),now=D.now;   // ο δοκιμαστικός παίκτης δεν μετρά στην τάξη
  const played=P.filter(p=>p.rounds>0);
  const act=P.filter(p=>p.last&&now-p.last<=WEEK);
  const nw=P.filter(p=>p.reg&&now-p.reg<=WEEK);
  const r7=D.days.slice(-7).reduce((s,d)=>s+d.r,0),rt=D.days[D.days.length-1].r;
  const ph=P.reduce((s,p)=>s+p.ph,0);
  const n=P.reduce((s,p)=>s+p.n,0),ok=P.reduce((s,p)=>s+p.ok,0);
  const tiles=[
    ['Μαθητές',P.length,'',`<b>+${nw.length}</b> νέοι την εβδομάδα`],
    ['Έπαιξαν τις 7 μέρες',act.length,'',`από ${played.length} που έχουν παίξει`],
    ['Γύροι τις 7 μέρες',r7,'',`<b>${rt}</b> σήμερα`],
    ['Φωτόνια τάξης',ph,'gold',`${P.filter(p=>p.ph>=10).length} μαθητές από Σπίθα και πάνω`],
    ['Σωστές απαντήσεις',n?pct(ok,n)+'%':'—','',`${ok} από ${n} · ${D.qActive} ενεργές ερωτήσεις`],
    ['Ενστάσεις',D.objOpen,D.objOpen?'gold':'',D.objOpen?'περιμένουν έλεγχο':`όλες ελεγμένες (${D.objTotal})`]];
  return `<div class="kpis">${tiles.map(t=>`<div class="kpi"><div class="l">${t[0]}</div><div class="v ${t[2]}">${t[1]}</div><div class="s">${t[3]}</div></div>`).join('')}</div>`;
}

function activity(){
  const mx=Math.max(1,...D.days.map(d=>d.r));
  const W=['Κυ','Δε','Τρ','Τε','Πε','Πα','Σα'];
  const bars=D.days.map((d,i)=>{const h=Math.round(100*d.r/mx);const dt=new Date(d.d+'T12:00:00');
    const lab=d.d.slice(8)+'/'+String(+d.d.slice(5,7));
    return `<div class="c" data-tip="${W[dt.getDay()]} ${lab}: ${d.r} ${d.r===1?'γύρος':'γύροι'} · ${d.p} ${d.p===1?'μαθητής':'μαθητές'}">${d.r?`<span class="n" style="bottom:${h}%">${d.r}</span>`:''}<div class="b ${d.r?'':'z'}" style="height:${h}%"></div></div>`}).join('');
  const ax=D.days.map((d,i)=>{const dt=new Date(d.d+'T12:00:00');return `<span>${i%2===1||D.days.length-1===i?(i===D.days.length-1?'σήμ.':W[dt.getDay()]):''}</span>`}).join('');
  return `<div class="card"><h2>Δραστηριότητα</h2><div class="sub">Γύροι ανά μέρα, τελευταίες 14 μέρες</div><div class="act">${bars}</div><div class="axis">${ax}</div></div>`;
}

function chapters(){
  const rows=CHS.map(c=>{const g=D.chapters.find(x=>x.ch===c)||{n:0,ok:0};return {c,n:g.n,p:g.n?g.ok/g.n:null}})

  return `<div class="card"><h2>Ανά κεφάλαιο</h2><div class="sub">% σωστές απαντήσεις της τάξης · το πιο δύσκολο πρώτο</div>${rows.map(r=>

function spark(a){
  if(!a||a.length<2)return '';
  const w=260,h=54,mx=25,st=w/(a.length-1);
  const pts=a.map((v,i)=>[i*st,h-4-(h-10)*v/mx]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const y20=(h-4-(h-10)*20/mx).toFixed(1);
  return `<div class="spk"><div class="sl">Σκορ των τελευταίων ${a.length} γύρων (γραμμή: 20/25)</div><svg viewBox="-6 -2 ${w+12} ${h+4}" width="100%" style="display:block;max-width:420px"><line x1="0" x2="${w}" y1="${y20}" y2="${y20}" stroke="#2E4566" stroke-dasharray="4 4" stroke-width="1"/><path d="${d}" fill="none" stroke="#F5B841" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${a[i]>=25?'#F5B841':'#16263D'}" stroke="#F5B841" stroke-width="1.5" vector-effect="non-scaling-stroke"><title>${a[i]}/25</title></circle>`).join('')}</svg></div>`;
}

/* Στοιχεία μαθητή για την περίοδο που έχει επιλεγεί: σήμερα (d), 7 μέρες (w) ή συνολικά */
function pv(p){
  if(period==='all')return {ph:p.ph,rounds:p.rounds,avg:p.avg,n:p.n,ok:p.ok,best:p.best};
  const g=p[period]||{r:0,sum:0,best:0,ph:0,n:0,ok:0};
  return {ph:g.ph,rounds:g.r,avg:g.r?g.sum/g.r:null,n:g.n,ok:g.ok,best:g.r?g.best:null};
}
function players(){
  const S={ph:(a,b)=>b.v.ph-a.v.ph||b.v.rounds-a.v.rounds,rounds:(a,b)=>b.v.rounds-a.v.rounds||b.v.n-a.v.n,avg:(a,b)=>(b.v.avg??-1)-(a.v.avg??-1),
    ok:(a,b)=>(b.v.n?b.v.ok/b.v.n:-1)-(a.v.n?a.v.ok/a.v.n:-1),seen:(a,b)=>b.p.seen-a.p.seen};
  let L=D.players.map(p=>({p,v:pv(p)}));
  if(period!=='all')L=L.filter(x=>x.v.rounds>0||x.v.n>0);
  const cnt=L.filter(x=>!x.p.test).length,rds=L.reduce((s,x)=>s+(x.p.test?0:x.v.rounds),0);
  if(q)L=L.filter(x=>x.p.nick.toLowerCase().includes(q.toLowerCase()));
  L.sort(S[sortBy]);
  L=L.filter(x=>!x.p.test).concat(L.filter(x=>x.p.test));   // ο δοκιμαστικός παίκτης τελευταίος, χωρίς θέση
  const B=[['ph','Φωτόνια'],['rounds','Γύροι'],['avg','Μέσο σκορ'],['ok','% σωστές'],['seen','Πρόσφατοι']];
  const T=[['d','Σήμερα'],['w','7 μέρες'],['all','Όλα']];
  const when=period==='d'?'Σήμερα':'Τις τελευταίες 7 μέρες';
  const sub=period==='all'?'Πάτα έναν μαθητή για λεπτομέρειες':`${when} έπαιξαν <b>${cnt}</b> ${cnt===1?'μαθητής':'μαθητές'} · <b>${rds}</b> ${rds===1?'ολοκληρωμένος γύρος':'ολοκληρωμένοι γύροι'}`;
  const none=period==='d'?'Κανένας δεν έχει παίξει σήμερα ακόμα.':period==='w'?'Κανένας δεν έπαιξε τις τελευταίες 7 μέρες.':'Κανένας μαθητής ακόμα.';
  return `<div class="card"><h2>Μαθητές</h2><div class="sub">${sub}</div>
    <div class="ctl"><div class="seg per"><span class="sl2">Περίοδος</span>${T.map(b=>`<button data-t="${b[0]}" class="${period===b[0]?'on':''}">${b[1]}</button>`).join('')}</div>
    <div class="seg srt"><span class="sl2">Ταξινόμηση</span>${B.map(b=>`<button data-s="${b[0]}" class="${sortBy===b[0]?'on':''}">${b[1]}</button>`).join('')}</div>
    <input class="srch" id="q" placeholder="Αναζήτηση ψευδωνύμου" value="${esc(q)}"></div>
    <div class="pl">${L.length?L.map((x,i)=>player(x.p,i,x.v)).join(''):`<div class="empty">${q?'Δεν βρέθηκε μαθητής.':none}</div>`}</div></div>`;
}

      <label class="ck"><input type="checkbox" id="eon"${q.on?' checked':''}> Ενεργή (βγαίνει στο παιχνίδι)</label>
      <div class="msg" id="em"></div>
      <div class="bts"><button class="cn" id="ecn">Άκυρο</button><button class="sv" id="esv">Αποθήκευση</button></div></div>`;
    document.getElementById('ecn').onclick=closeEd;
    const ea=document.getElementById('ea');
    if(mc)ea.onchange=()=>ov.querySelectorAll('.or').forEach((r,i)=>r.classList.toggle('r',G[i]===ea.value));
    document.getElementById('esv').onclick=()=>{
      const b=document.getElementById('esv'),em=document.getElementById('em');
      const d={q:document.getElementById('eq').value,ans:ea.value,ex:document.getElementById('ex').value,on:document.getElementById('eon').checked};
      if(mc)d.o=[0,1,2,3].map(i=>document.getElementById('eo'+i).value);
      if(!d.q.trim()||(mc&&d.o.some(x=>!x.trim()))){em.textContent=EMSG.bad;return}
      b.disabled=true;em.textContent='Αποθήκευση…';
      apiCall('dashSaveQ',[KEY,q.id,d],1).then(()=>{em.textContent='Αποθηκεύτηκε. Η αλλαγή ισχύει ήδη στο παιχνίδι.';setTimeout(()=>{closeEd();load(true)},900)})
        .catch(e=>{b.disabled=false;em.textContent=emsg(e)});
    };
  }).catch(e=>{const m=ov.querySelector('.msg');if(m)m.textContent=e&&e.message==='gone'?'Δεν υπάρχει ερώτηση με αυτό το id.':e&&e.message==='bad'?'Το id δεν είναι σωστό.':emsg(e)});
}
function resolveObj(b){
  b.disabled=true;b.textContent='Αποθήκευση…';
  apiCall('dashResolve',[KEY,+b.dataset.res,b.dataset.qid,'Ελέγχθηκε '+new Date().toLocaleDateString('el-GR')],1).then(()=>load(true))
    .catch(e=>{b.disabled=false;b.textContent=emsg(e)});
}
function render(){
  const y=window.scrollY;
  document.getElementById('app').innerHTML=`
  <div class="top"><div class="brand">${LOGO}<div class="bt">ΦΩΤΟΝΙΟ <b>QUIZ</b><small>Πίνακας καθηγητή</small></div></div>
    <div class="upd"><span class="dot"></span><span id="ago">ενημερώθηκε τώρα</span><button class="rf" id="rf">Ανανέωση</button></div></div>
  ${kpis()}
  <div class="grid2">${activity()}${chapters()}</div>
  ${players()}
  <div class="grid2">${hard()}<div style="display:flex;flex-direction:column;gap:16px">${objs()}${finder()}${newbies()}</div></div>`;
  window.scrollTo(0,y);
  document.getElementById('rf').onclick=()=>load(true);
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEd(b.dataset.edit));
  document.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>resolveObj(b));
  const qg=document.getElementById('qgo');if(qg){const go=()=>openEd(document.getElementById('qid').value);qg.onclick=go;document.getElementById('qid').onkeydown=e=>{if(e.key==='Enter')go()}}
  document.querySelectorAll('.seg.srt button').forEach(b=>b.onclick=()=>{sortBy=b.dataset.s;render()});
  document.querySelectorAll('.seg.per button').forEach(b=>b.onclick=()=>{period=b.dataset.t;render()});
  const qi=document.getElementById('q');qi.oninput=()=>{q=qi.value;const pos=qi.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)};
  document.querySelectorAll('.p>button').forEach(b=>b.onclick=()=>{const n=b.parentNode.dataset.n;openSet.has(n)?openSet.delete(n):openSet.add(n);b.parentNode.classList.toggle('open');b.setAttribute('aria-expanded',openSet.has(n))});
}
// tooltip για στήλες και μπάρες
const tip=document.getElementById('tip');
function showTip(e){const t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}
  tip.textContent=t.dataset.tip;tip.style.display='block';const r=t.getBoundingClientRect();
  let x=r.left+r.width/2-tip.offsetWidth/2;x=Math.max(8,Math.min(x,innerWidth-tip.offsetWidth-8));
  tip.style.left=x+'px';tip.style.top=Math.max(8,r.top-tip.offsetHeight-8)+'px'}
document.addEventListener('pointerover',showTip);document.addEventListener('pointerdown',showTip);
document.addEventListener('scroll',()=>tip.style.display='none',{passive:true});
setInterval(()=>{const a=document.getElementById('ago');if(a&&lastLoad){const m=Math.round((Date.now()-lastLoad)/60000);a.textContent=m<1?'ενημερώθηκε τώρα':'ενημερώθηκε πριν '+m+'΄'}},20000);
setInterval(()=>{if(!document.hidden)load()},120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastLoad>60000)load()});
/* Σύνδεση με το Apps Script (το Sheet του καθηγητή) μέσω απλού αιτήματος, χωρίς πλαίσιο της Google */
const API_URL='https://script.google.com/macros/s/AKfycbwoioQnP3Akcq6fvg0NuGGhjRryhF-g139khGRPJM-QkYMISVRggAGnQIqcJBrbmU-M6A/exec';
function apiCall(fn,args,tries){
  tries=tries==null?2:tries;
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow',credentials:'omit',cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json()})
    .then(j=>{if(!j.ok){const e=new Error(j.err||'error');e.server=true;throw e}return j.r})
    .catch(e=>{if(!e.server&&tries>1)return new Promise(r=>setTimeout(r,900)).then(()=>apiCall(fn,args,tries-1));throw e});
}

function getKey_(){let k='';try{if(location.hash.length>1){k=decodeURIComponent(location.hash.slice(1));localStorage.setItem('fotonio_dash_key',k);history.replaceState(null,'',location.pathname)}else k=localStorage.getItem('fotonio_dash_key')||''}catch(e){}return k}
KEY=getKey_();
function needKey(msg){
  document.getElementById('app').innerHTML=`<div class="card" style="max-width:420px;margin:40px auto;text-align:center">
    <div style="display:flex;justify-content:center;margin-bottom:10px">${LOGO.replace('<svg ','<svg style="width:56px;height:56px" ')}</div>
    <h2 style="margin-bottom:6px">Πίνακας καθηγητή</h2><div class="sub">${msg||'Γράψε τον κωδικό του πίνακα. Θα τον θυμάται αυτή η συσκευή.'}</div>
    <input class="srch" id="kin" type="password" autocomplete="off" placeholder="Κωδικός" style="width:100%;margin:6px 0 12px;text-align:center">
    <button class="rf" id="kgo" style="width:100%;padding:10px">Άνοιγμα</button></div>`;
  const go=()=>{KEY=document.getElementById('kin').value.trim();try{localStorage.setItem('fotonio_dash_key',KEY)}catch(e){}load()};
  document.getElementById('kgo').onclick=go;document.getElementById('kin').onkeydown=e=>{if(e.key==='Enter')go()};
}
function BACKEND(k){return apiCall('dash',[k]).catch(e=>{if(e.server&&/auth/.test(e.message)){try{localStorage.removeItem('fotonio_dash_key')}catch(_){}needKey('Λάθος κωδικός. Δοκίμασε ξανά.');return new Promise(()=>{})}throw e})}
window.addEventListener('hashchange',()=>{const k=getKey_();if(k){KEY=k;load()}});

if(KEY)load();else needKey();
</script>
